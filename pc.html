<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEOГРАФИЯ</title>

    <script>
        (function() {
            const isMobileDevice = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            const isSmallScreen = window.innerWidth <= 768;
            
            if (isMobileDevice || isSmallScreen) {
                window.location.replace("mobile.html");
            }
        })();
    </script>
    
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&family=Unbounded:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <style>
        .session-dashboard {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #0b0b0b;
            z-index: 99999;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 1.2s cubic-bezier(0.25, 1, 0.5, 1);
            pointer-events: none;
        }

        .session-dashboard.show-framework {
            opacity: 1;
            pointer-events: auto;
        }

        .db-title {
            font-family: 'Unbounded', sans-serif;
            font-size: clamp(24px, 4vw, 42px);
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-align: center;
            line-height: 1.3;
        }

        .db-message {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(14px, 1.8vw, 18px);
            font-weight: 700;
            color: #8E8E93;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-align: center;
            max-width: 600px;
            line-height: 1.6;
        }

        .db-title span, .db-message span {
            display: inline-block;
            opacity: 0;
            filter: blur(8px);
            transform: translateY(12px);
            transition: opacity 0.8s cubic-bezier(0.25, 1, 0.5, 1),
                        filter 0.8s cubic-bezier(0.25, 1, 0.5, 1),
                        transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            white-space: pre;
        }

        .session-dashboard.show-framework .db-title span,
        .session-dashboard.show-framework .db-message span {
            opacity: 1;
            filter: blur(0px);
            transform: translateY(0);
        }

        .input-error-state {
            border-color: rgba(255, 69, 58, 0.8) !important;
            box-shadow: 0 0 15px rgba(255, 69, 58, 0.3) !important;
            animation: shakeError 0.4s ease-in-out !important;
        }

        @keyframes shakeError {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        body.page-fade-out .session-dashboard {
            opacity: 0 !important;
            transition: opacity 1.2s cubic-bezier(0.25, 1, 0.5, 1) !important;
        }

        .prompt-text.fade-out-element,
        .app-banners-container.fade-out-element,
        .brand-block.fade-out-element,
        .input-wrapper.fade-out-element {
            opacity: 0 !important;
            filter: blur(10px) !important;
            transform: scale(0.95) !important;
            transition: opacity 0.8s ease, filter 0.8s ease, transform 0.8s ease !important;
            pointer-events: none !important;
        }
    </style>
</head>
<body>

    <div class="shadow-layer"></div>
    <img src="images/gerb.png" alt="Герб" class="bg-blur-gerb">

    <div class="app-banners-container" id="app-banners-container">
        <div class="app-banner banner-warning" id="banner-alert">
            <svg class="banner-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                <line x1="12" y1="9" x2="12" y2="13"/>
                <line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
            <span class="banner-text">ВЕДУТСЯ ТЕХНИЧЕСКИЕ РАБОТЫ — ДОСТУП ОГРАНИЧЕН</span>
        </div>
    </div>

    <main class="main-container">
        
        <div class="brand-block">
            <img src="images/logo.png" alt="Логотип GEOГРАФИЯ" class="app-logo">
            <div class="brand-text-group">
                <h1 class="main-title">GEOГРАФИЯ</h1>
            </div>
        </div>

        <div class="input-wrapper">
            <input 
                type="text" 
                id="access-code-input"
                class="geo-input" 
                placeholder="ВВЕДИТЕ КОД ДОСТУПА" 
                maxlength="32" 
                autocomplete="off" 
                spellcheck="false"
            >
            <button class="geo-submit-btn" id="access-code-submit" aria-label="Подтвердить">
                <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
                <div class="btn-spinner"></div>
            </button>
        </div>

        <p class="prompt-text">ДЛЯ ПОЛУЧЕНИЯ ДОСТУПА ВВЕДИТЕ КЛЮЧ СЕССИИ</p>

    </main>

    <div class="session-dashboard" id="session-dashboard">
        <div class="db-title" id="db-animate-title">СЕССИЯ ПОДТВЕРЖДЕНА</div>
        <div class="db-message" id="db-animate-message">ДОБРО ПОЖАЛОВАТЬ В СИСТЕМУ</div>
    </div>

    <div class="dev-console">
        <div class="console-header">
            <span class="console-title">TERMINAL // GEO_AUTH</span>
            <button class="console-close" id="console-close-btn">&times;</button>
        </div>

        <div class="console-auth-container" id="console-auth-screen">
            <p class="auth-title">ТРЕБУЕТСЯ АВТОРИЗАЦИЯ РАЗРАБОТЧИКА</p>
            <input type="password" id="console-pass-input" placeholder="Пароль..." class="geo-input" style="max-width: 200px; height: 35px; font-size: 12px;">
            <button id="console-auth-btn" class="geo-submit-btn" style="width: auto; padding: 0 15px; height: 35px; font-size: 11px;">ВОЙТИ</button>
            <p class="auth-error" id="console-auth-error" style="display: none;">НЕВЕРНЫЙ ПАРОЛЬ</p>
        </div>

        <div class="console-main-container" id="console-main-screen" style="display: none;">
            <div class="console-output" id="console-output"></div>
            <div class="console-input-row">
                <span class="console-prompt">&gt;</span>
                <input type="text" id="console-input" placeholder="Введите команду..." autocomplete="off">
            </div>
        </div>
    </div>

    <script>
        const myInput = document.getElementById('access-code-input');
        const submitBtn = document.getElementById('access-code-submit');
        const promptText = document.querySelector('.prompt-text');
        const bannerAlert = document.getElementById('banner-alert');
        const versionBadge = document.getElementById('version-badge');
        const dashboardOverlay = document.getElementById('session-dashboard');
        
        let livesInErrorState = false;

        function prepareDashboardSpans(elementId, baseDelay = 0) {
            const container = document.getElementById(elementId);
            if (!container) return;
            const text = container.innerText;
            container.innerHTML = '';
            
            let currentDelay = baseDelay;
            
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const span = document.createElement('span');
                span.innerText = char;
                span.style.transitionDelay = `${currentDelay.toFixed(2)}s`;
                container.appendChild(span);
                currentDelay += 0.03;
            }
        }

        if (myInput && submitBtn) {
            myInput.addEventListener('input', () => {
                if (livesInErrorState) {
                    myInput.classList.remove('input-error-state');
                    submitBtn.classList.remove('state-error');
                    livesInErrorState = false;
                }

                if (myInput.value.trim().length > 0) {
                    submitBtn.classList.add('state-active');
                } else {
                    submitBtn.classList.remove('state-active');
                }
            });

            myInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    submitBtn.click();
                }
            });

            submitBtn.addEventListener('click', async () => {
                const code = myInput.value.trim();
                if (!code) return;

                submitBtn.classList.remove('state-active', 'state-error');
                submitBtn.classList.add('state-loading');

                try {
                    const response = await fetch('/api/verify', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ code })
                    });

                    const data = await response.json();
                    submitBtn.classList.remove('state-loading');

                    if (response.ok && data.success) {
                        submitBtn.classList.add('state-success');
                        
                        const brandBlock = document.querySelector('.brand-block');
                        const inputWrapper = document.querySelector('.input-wrapper');
                        const bannersContainer = document.getElementById('app-banners-container');
                        
                        if (brandBlock) brandBlock.classList.add('fade-out-element');
                        if (inputWrapper) inputWrapper.classList.add('fade-out-element');
                        if (bannersContainer) bannersContainer.classList.add('fade-out-element');
                        if (promptText) promptText.classList.add('fade-out-element');
                        if (bannerAlert) bannerAlert.classList.add('fade-out-element');
                        if (versionBadge) versionBadge.classList.remove('show');
                        
                        if (dashboardOverlay) {
                            dashboardOverlay.style.display = 'flex';
                            prepareDashboardSpans('db-animate-title', 0.20);
                            prepareDashboardSpans('db-animate-message', 0.50);
                            
                            requestAnimationFrame(() => {
                                dashboardOverlay.classList.add('show-framework');
                            });
                        }
                        
                        setTimeout(() => {
                            document.body.classList.add('page-fade-out');
                        }, 4000); 

                        setTimeout(() => {
                            window.location.replace('/beginning.html');
                        }, 5400);

                    } else {
                        livesInErrorState = true;
                        if (myInput) myInput.classList.add('input-error-state'); 
                        submitBtn.classList.add('state-error');        
                    }
                } catch (err) {
                    console.error("Ошибка сети или сервера:", err);
                    submitBtn.classList.remove('state-loading');
                    livesInErrorState = true;
                    if (myInput) myInput.classList.add('input-error-state'); 
                    submitBtn.classList.add('state-error');
                }
            });
        }
    </script>     

    <script>
        (function() {
            const vBadge = document.getElementById('version-badge');
            let clickCount = 0;
            let clickTimer = null;
            let badgeHideTimer = null;

            document.addEventListener('click', (e) => {
                // Игнорируем клики по консоли или полям ввода
                if (e.target.closest('.dev-console') || e.target.closest('input') || e.target.closest('button')) {
                    return;
                }

                clickCount++;

                // Сброс счётчика при паузе между кликами более 800 мс
                clearTimeout(clickTimer);
                clickTimer = setTimeout(() => {
                    clickCount = 0;
                }, 800);

                // Показ плашки при достижении 5 кликов
                if (clickCount >= 5) {
                    clickCount = 0;
                    clearTimeout(clickTimer);

                    if (vBadge) {
                        vBadge.classList.add('show');

                        clearTimeout(badgeHideTimer);
                        badgeHideTimer = setTimeout(() => {
                            vBadge.classList.remove('show');
                        }, 3000);
                    }
                }
            });
        })();
    </script>

    <script src="console.js" defer></script>
    <div class="version-badge" id="version-badge">PC-VERSION</div>
</body>
</html>
