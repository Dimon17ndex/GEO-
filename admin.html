<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEOГРАФИЯ — Админ Панель</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js" defer></script>
    <script src="console.js" defer></script>

    <link rel="icon" type="image/png" href="images/favicon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&family=Unbounded:wght@400;700;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="beginning.css">

    <style>
        /* Когда пользователь вошел — гарантированно скрываем центральную кнопку */
        body.user-logged-in #open-auth-btn {
            display: none !important;
        }

        /* Плавное проявление и затухание страницы */
        body {
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        body.page-loaded {
            opacity: 1;
        }

        /* Класс для плавного угасания перед переходом */
        body.page-hidden {
            opacity: 0 !important;
        }

        /* Позиционирование бренд-блока в верхнем левом углу */
        .top-left-brand {
            position: fixed;
            top: 40px;
            left: 40px;
            z-index: 10;
        }

        .top-left-brand .db-brand-block {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .top-left-brand .db-logo-icon {
            height: auto;
            max-width: 110px;
            width: 100%;
            display: block;
            will-change: transform;
            animation: floatingLogo 4s ease-in-out infinite alternate !important;
        }

        .top-left-brand .db-text-right {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            gap: 4px;
            will-change: transform;
            animation: floatingText 4.5s ease-in-out infinite alternate !important;
        }

        .top-left-brand .db-main-title {
            margin: 0;
            font-family: 'Unbounded', sans-serif;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: -0.5px;
            line-height: 1;
            color: #ffffff;
        }

        /* Подзаголовок "РЕЖИМ ADMIN" под заголовком */
        .admin-mode-badge {
            display: inline-block;
            font-family: 'Montserrat', sans-serif;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #e74c3c;
            background: rgba(231, 76, 60, 0.15);
            border: 1px solid rgba(231, 76, 60, 0.4);
            padding: 3px 8px;
            border-radius: 6px;
            margin-top: 2px;
            box-shadow: 0 0 10px rgba(231, 76, 60, 0.2);
        }

        /* Плашка "АВТОРИЗОВАННЫЕ GEOUSERS" */
        .admin-sub-badge {
            position: fixed;
            top: 165px;  /* Смещена ниже */
            left: 160px; /* Смещена правее */
            z-index: 10;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            backdrop-filter: blur(10px);
            font-family: 'Montserrat', sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: rgba(255, 255, 255, 0.8);
            text-transform: uppercase;
            transition: all 0.3s ease;
            cursor: default;
            user-select: none;
        }

        .admin-sub-badge:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
            color: #ffffff;
        }

        /* =========================================================
           СПИСОК ПЛАШЕК ДЛЯ GEOUSERS (ПОД ПЛАШКОЙ "АВТОРИЗОВАННЫЕ...")
           ========================================================= */
        .geousers-list-container {
            position: fixed;
            top: 220px;          /* Чуть ниже плашки admin-sub-badge */
            left: 160px;         /* По левому краю верхнего бейджа */
            width: 600px;        /* Длинная фиксированная ширина */
            max-height: calc(100vh - 250px); /* Добавлен скролл, если пользователей много */
            overflow-y: auto;
            padding-right: 6px;
            display: flex;
            flex-direction: column;
            gap: 12px;           /* Расстояние между плашками */
            z-index: 10;
        }

        /* Кастомный красивый скроллбар */
        .geousers-list-container::-webkit-scrollbar {
            width: 6px;
        }
        .geousers-list-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        .geouser-row-item {
            display: flex;
            align-items: center;  /* Вертикальное центрирование содержимого */
            gap: 16px;           /* Отступ между цифрой и плашкой */
            width: 100%;
        }

        /* Цифра слева без контейнера */
        .geouser-number {
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            font-weight: 800;
            color: rgba(255, 255, 255, 0.4);
            min-width: 45px;
            text-align: right;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 6px;
        }

        /* Лейбл "ВЫ" перед номером пользователя */
        .geouser-you-badge {
            font-family: 'Montserrat', sans-serif;
            font-size: 10px;
            font-weight: 900;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 2px 6px;
            border-radius: 5px;
            letter-spacing: 0.5px;
            text-shadow: 0 0 6px rgba(255, 255, 255, 0.5);
        }

        /* Сама длинная плашка */
        .geouser-card-box {
            flex: 1;
            display: flex;
            align-items: center;  /* Вертикальное центрирование текста внутри */
            gap: 12px;           /* Отступ между иконкой и текстом */
            min-height: 48px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        /* Усиленная обводка для карточки ТЕКУЩЕГО пользователя */
        .geouser-card-box.currentUserCard {
            border: 1px solid rgba(255, 255, 255, 0.75) !important;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.25), inset 0 0 12px rgba(255, 255, 255, 0.08) !important;
            background: rgba(255, 255, 255, 0.08) !important;
        }

        .geouser-card-box:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateX(4px);
        }

        /* Стили для SVG иконки профиля */
        .geouser-avatar-icon {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            stroke: rgba(255, 255, 255, 0.5);
            transition: stroke 0.25s ease;
        }

        .geouser-card-box:hover .geouser-avatar-icon {
            stroke: #3498db; /* Симпатичный подсвечивающийся синий акцент */
        }

        /* Анимация левитации логотипа и текста */
        @keyframes floatingLogo {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(-1.5deg); }
            100% { transform: translateY(5px) rotate(1.5deg); }
        }

        @keyframes floatingText {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
            100% { transform: translateY(4px); }
        }

        /* =========================================================
           ВИДЖЕТ ПРОФИЛЯ В ВЕРХНЕМ ПРАВОМ УГЛУ
           ========================================================= */
        .top-right-profile {
            position: fixed;
            top: 40px;          /* На одном уровне с логотипом */
            right: 140px;       /* Безопасное расстояние от шестерёнки */
            z-index: 10;
        }

        .profile-card {
            position: relative;
            display: inline-block;
            padding: 10px 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .profile-username {
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
            display: flex;
            align-items: center;
        }

        /* Контейнер по центру для новых элементов админки */
        .center-status-wrapper {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            pointer-events: none;
            text-align: center;
            width: 90%;
            max-width: 650px;
        }

        .center-status-wrapper * {
            pointer-events: auto;
        }

        .auth-trigger-btn {
            pointer-events: auto;
        }

        /* =========================================================
           ВЫДВИЖНАЯ СЕКРЕТНАЯ ПАНЕЛЬ АДМИНИСТРАТОРА
           ========================================================= */
        .dev-side-panel {
            position: fixed;
            top: 50%;
            right: 0;
            transform: translate(100%, -50%);
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 15px;
            background: rgba(15, 15, 20, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-right: none;
            border-radius: 16px 0 0 16px;
            backdrop-filter: blur(15px);
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.5);
            z-index: 9999;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .dev-side-panel.visible {
            transform: translate(0, -50%);
        }

        .dev-panel-btn {
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border-radius: 10px;
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.25s ease;
        }

        .dev-panel-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateX(-3px);
        }

        .dev-panel-btn.active-page {
            border-color: #3498db;
            background: rgba(52, 152, 219, 0.2);
        }
    </style>
</head>
<body>

    <div class="app-banners-container">
        <div class="app-banner banner-warning">
            <span class="banner-icon">🛠</span>
            <span>Ведется разработка сайта в раннем доступе</span>
        </div>
    </div>

    <div class="shadow-layer"></div>

    <div id="bg-wave-container"></div>

    <div class="top-left-brand">
        <div class="db-brand-block">
            <img src="images/geo_logo.png" alt="Geo Logo" class="db-logo-icon">
            <div class="db-text-right">
                <h1 class="db-main-title">GEOГРАФИЯ</h1>
                <span class="admin-mode-badge">РЕЖИМ ADMIN</span>
            </div>
        </div>
    </div>

    <div class="admin-sub-badge">
        АВТОРИЗОВАННЫЕ GEOUSERS
    </div>

    <div class="geousers-list-container" id="geousers-list-container">
        <div class="geouser-row-item">
            <span class="geouser-number">--</span>
            <div class="geouser-card-box">

                </svg>

            </div>
        </div>
    </div>

    <div class="center-status-wrapper">
        <button type="button" id="open-auth-btn" class="auth-trigger-btn" onclick="showAuthModal()">

    </div>

    <div class="settings-trigger-zone" id="settings-btn" style="opacity: 1; pointer-events: auto;">
        <div class="settings-container-box">
            <div class="settings-icon-box">
                <svg class="gear-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.15a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.1a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>

                    <path class="volume-wave-2" d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                </svg>
                <div class="volume-label" id="volume-status-label">музыка <span class="status-on">on</span> / <span class="status-off">off</span></div>

                        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>

    <div id="user-profile-widget" class="top-right-profile" style="display: none;">
        <div class="profile-card">
            <span class="profile-username" id="profile-email-text">Профиль</span>
        </div>
    </div>

    <div id="dev-side-panel" class="dev-side-panel">
        <button type="button" class="dev-panel-btn" id="btn-main-profile" onclick="navigateToPage('beginning.html')">
            Основной профиль
        </button>
        <button type="button" class="dev-panel-btn" id="btn-admin-profile" onclick="navigateToPage('admin.html')">
            Профиль администратора
        </button>
    </div>

    <script src="auth-system.js?v=3"></script>

    <script>
    const waveContainer = document.getElementById('bg-wave-container');
    const volumeStatusLabel = document.getElementById('volume-status-label');
    const intensitySlider = document.getElementById('wave-intensity-slider');
    const intensityValueLabel = document.getElementById('intensity-value');
    
    let intensityPercent = 20;
    let ambientTimeoutId = null;

    function createBackgroundRipple(x, y, className, duration = 1500) {
        if (!waveContainer) return;
        const ripple = document.createElement('div');
        ripple.classList.add(className);
        ripple.style.left = `${x}px`;
        ripple.style.top = `${y}px`;
        waveContainer.appendChild(ripple);
        setTimeout(() => { ripple.remove(); }, duration);
    }

    function spawnAmbientWave() {
        clearTimeout(ambientTimeoutId);

        if (intensityPercent === 0) { 
            ambientTimeoutId = setTimeout(spawnAmbientWave, 1000); 
            return; 
        }

        let spawnX = 0, spawnY = 0;
        const side = Math.floor(Math.random() * 4);
        switch(side) {
            case 0: spawnX = Math.random() * window.innerWidth; spawnY = -50; break;
            case 1: spawnX = window.innerWidth + 50; spawnY = Math.random() * window.innerHeight; break;
            case 2: spawnX = Math.random() * window.innerWidth; spawnY = window.innerHeight + 50; break;
            case 3: spawnX = -50; spawnY = Math.random() * window.innerHeight; break;
        }

        createBackgroundRipple(spawnX, spawnY, 'bg-ambient-ripple', 3000);

        const baseDelay = 500, maxAdditionalDelay = 8000; 
        const factor = (100 - intensityPercent) / 100;
        const nextDelay = baseDelay + (Math.random() * maxAdditionalDelay * factor);

        ambientTimeoutId = setTimeout(spawnAmbientWave, nextDelay);
    }

    const bgMusic = new Audio('audio/melody_start.mp3');
    bgMusic.volume = 0.4; 
    let musicStarted = false;

    function playMusic() {
        if (musicStarted || bgMusic.muted) return;
        bgMusic.play().then(() => { musicStarted = true; }).catch(() => {});
    }

    bgMusic.addEventListener('ended', () => {
        setTimeout(() => { if (!bgMusic.muted) bgMusic.play(); }, 5000); 
    });

    document.body.addEventListener('mousedown', (e) => {
        if (e.target.closest('#settings-btn') || e.target.closest('.settings-trigger-zone')) return;
        playMusic();
        createBackgroundRipple(e.clientX, e.clientY, 'bg-click-ripple');
    });

    const volumeBtn = document.getElementById('volume-toggle-btn');
    const volumeIcon = document.getElementById('volume-icon');
    let isMuted = false;

    volumeBtn?.addEventListener('click', (e) => {
        e.stopPropagation(); 
        isMuted = !isMuted;
        bgMusic.muted = isMuted;
        if (isMuted) {
            volumeStatusLabel?.classList.add('muted-mode');
            volumeIcon.innerHTML = `<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15" stroke="currentColor" stroke-width="1.5"></line><line x1="17" y1="9" x2="23" y2="15" stroke="currentColor" stroke-width="1.5"></line>`;
        } else {
            volumeStatusLabel?.classList.remove('muted-mode');
            volumeIcon.innerHTML = `<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path class="volume-wave-1" d="M19.07 4.93a10 10 0 0 1 0 14.14"></path><path class="volume-wave-2" d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>`;
            playMusic();
        }
    });

    intensitySlider?.addEventListener('mousedown', (e) => { e.stopPropagation(); });
    intensitySlider?.addEventListener('input', (e) => {
        intensityPercent = parseInt(e.target.value);
        if (intensityValueLabel) intensityValueLabel.innerText = `${intensityPercent}%`;
    });

    history.pushState(null, null, location.href);
    window.addEventListener('popstate', function () {
        navigateToPage('index.html');
    });

    function navigateToPage(targetPage) {
        const currentPage = window.location.pathname.split('/').pop() || 'beginning.html';
        
        if (currentPage === targetPage) return;

        document.body.classList.add('page-hidden');

        setTimeout(() => {
            window.location.href = targetPage;
        }, 500);
    }

    // Вспомогательная функция безопасного получения Supabase клиента
    function getSupabaseClient() {
        if (window.supabaseClient) return window.supabaseClient;
        if (window.supabase && typeof window.supabase.from === 'function') return window.supabase;
        return null;
    }

    // Функция отрисовки списка пользователей из базы Supabase
    async function fetchAndRenderUsers() {
        const container = document.getElementById('geousers-list-container');
        if (!container) return;

        const client = getSupabaseClient();
        if (!client) {
            console.warn('Supabase клиент не найден. Загрузите или инициализируйте Supabase.');
            return;
        }

        // Векторный значок аккаунта
        const userIconSVG = `
            <svg class="geouser-avatar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
        `;

        try {
            // 1. Проверяем ID текущего авторизованного пользователя
            let currentUserId = null;
            if (client.auth) {
                const { data: { session } } = await client.auth.getSession();
                if (session?.user) {
                    currentUserId = session.user.id;
                }
            }

            // 2. Запрос к публичной таблице profiles
            const { data: users, error } = await client
                .from('profiles')
                .select('*');

            if (error) throw error;

            if (!users || users.length === 0) {
                container.innerHTML = `
                    <div class="geouser-row-item">
                        <span class="geouser-number">0</span>
                        <div class="geouser-card-box">
                            ${userIconSVG}
                            <span>Пользователи не найдены</span>
                        </div>
                    </div>`;
                return;
            }

            // 3. Если пользователь авторизован, гарантированно поднимаем его на 1-е место
            if (currentUserId) {
                const myIndex = users.findIndex(u => u.id === currentUserId);
                if (myIndex !== -1) {
                    const [myProfile] = users.splice(myIndex, 1);
                    users.unshift(myProfile);
                }
            }

            // 4. Рендерим пользователей
            container.innerHTML = users.map((u, index) => {
                // Проверяем, действительно ли эта плашка принадлежит текущему пользователю
                const isSelf = currentUserId && u.id === currentUserId;
                const hasUsername = u.username && u.username.trim() !== '' && u.username !== '—';

                const displayName = hasUsername 
                    ? `<strong>${u.username}</strong> <span style="opacity: 0.5; font-size: 0.9em; margin-left: 6px;">(${u.email || 'без email'})</span>`
                    : `<span style="opacity: 0.4; font-style: italic; font-weight: 400;">нет имени</span> <span style="opacity: 0.75; margin-left: 6px;">(${u.email || 'без email'})</span>`;

                // Бейдж "ВЫ" перед первой цифрой (только для своего профиля)
                const numberLabel = isSelf 
                    ? `<span class="geouser-you-badge">ВЫ</span><span>${index + 1}</span>` 
                    : `<span>${index + 1}</span>`;

                // Применяем класс с белой подсветкой для текущего пользователя
                const cardClass = isSelf ? 'geouser-card-box currentUserCard' : 'geouser-card-box';

                return `
                    <div class="geouser-row-item">
                        <div class="geouser-number">${numberLabel}</div>
                        <div class="${cardClass}">
                            ${userIconSVG}
                            <div>${displayName}</div>
                        </div>
                    </div>
                `;
            }).join('');

        } catch (err) {
            console.error('Ошибка загрузки пользователей:', err);
            container.innerHTML = `
                <div class="geouser-row-item">
                    <span class="geouser-number">!</span>
                    <div class="geouser-card-box" style="color: #e74c3c;">
                        ${userIconSVG}
                        <span>Ошибка при загрузке данных</span>
                    </div>
                </div>`;
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        requestAnimationFrame(() => {
            document.body.classList.add('page-loaded');
        });

        setTimeout(() => { spawnAmbientWave(); }, 1000);

        const DEV_EMAIL = 'dimay17ndex2009@yandex.ru';
        const sidePanel = document.getElementById('dev-side-panel');
        let hideTimeout = null;

        const currentPage = window.location.pathname.split('/').pop() || 'beginning.html';
        if (currentPage === 'beginning.html') {
            document.getElementById('btn-main-profile')?.classList.add('active-page');
        } else if (currentPage === 'admin.html') {
            document.getElementById('btn-admin-profile')?.classList.add('active-page');
        }

        async function initDevPanel() {
            const client = getSupabaseClient();
            if (!client || !client.auth) return;

            try {
                const { data: { session } } = await client.auth.getSession();
                
                // Включаем боковую панель администратора
                if (session?.user?.email === DEV_EMAIL) {
                    setupHoverDetection();
                }

                // Отображаем Email текущего авторизованного пользователя
                if (session?.user) {
                    document.body.classList.add('user-logged-in');
                    const widget = document.getElementById('user-profile-widget');
                    const emailText = document.getElementById('profile-email-text');
                    if (widget && emailText) {
                        emailText.innerText = session.user.email;
                        widget.style.display = 'block';
                    }
                }
            } catch (err) {
                console.error('Ошибка инициализации сессии:', err);
            }
        }

        function setupHoverDetection() {
            if (!sidePanel) return;
            let isMouseOverPanel = false;

            sidePanel.addEventListener('mouseenter', () => {
                isMouseOverPanel = true;
                if (hideTimeout) {
                    clearTimeout(hideTimeout);
                    hideTimeout = null;
                }
                sidePanel.classList.add('visible');
            });

            sidePanel.addEventListener('mouseleave', () => {
                isMouseOverPanel = false;
                if (hideTimeout) clearTimeout(hideTimeout);
                hideTimeout = setTimeout(() => {
                    sidePanel.classList.remove('visible');
                    hideTimeout = null;
                }, 2000);
            });

            document.addEventListener('mousemove', (e) => {
                const distanceFromRight = window.innerWidth - e.clientX;

                if (distanceFromRight <= 60) {
                    if (hideTimeout) {
                        clearTimeout(hideTimeout);
                        hideTimeout = null;
                    }
                    sidePanel.classList.add('visible');
                } else if (!isMouseOverPanel && sidePanel.classList.contains('visible')) {
                    if (!hideTimeout) {
                        hideTimeout = setTimeout(() => {
                            sidePanel.classList.remove('visible');
                            hideTimeout = null;
                        }, 2000);
                    }
                }
            });
        }

        // Запуск инициализации панелей и получения пользователей
        initDevPanel();
        fetchAndRenderUsers();
    });
    </script>

    <script src="reset-password.js"></script>
</body>
