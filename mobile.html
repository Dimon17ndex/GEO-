<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GEOГРАФИЯ</title>
    
    <script>
        (function() {
            const isMobileDevice = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            const isLargeScreen = window.innerWidth > 768;
            
            if (!isMobileDevice && isLargeScreen) {
                window.location.replace("index.html");
            }
        })();
    </script>

    <link rel="icon" type="image/png" href="images/favicon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&family=Unbounded:wght@400;700;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="mobile-style.css?v=1">
    
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: manipulation;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }

        /* --- БЛОК БРЕНДА --- */
        .brand-block {
            display: flex !important;
            flex-direction: row !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 16px !important;
        }

        .logo-icon {
            width: 76px !important;
            height: 76px !important;
            object-fit: contain;
            flex-shrink: 0;
        }

        .text-right {
            display: flex;
            flex-direction: column;
            align-items: flex-start !important;
            gap: 6px;
        }

        .main-title {
            font-size: 26px !important;
            font-weight: 900 !important;
            letter-spacing: 1.5px !important;
            line-height: 1 !important;
            margin: 0 !important;
            padding: 0 !important;
            text-align: left !important;
        }

        .subtitle-badge {
            padding: 3px 8px !important;
            border-radius: 30px !important;
            border: 1px solid rgba(255, 255, 255, 0.4) !important;
            display: inline-flex !important;
            align-items: center !important;
            margin: 0 !important;
        }

        .subtitle-badge span {
            font-size: 8px !important;
            font-weight: 600 !important;
            letter-spacing: 0.6px !important;
            line-height: 1 !important;
        }

        /* --- ЭКРАН УСПЕШНОЙ СЕССИИ --- */
        .session-dashboard {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100dvh;
            z-index: 9999; 
            pointer-events: none;
            overflow: hidden;
            display: none; 
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: transparent !important;
        }

        .session-dashboard::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 10px;
            height: 10px;
            transform: translate(-50%, 50%) scale(1);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 255, 110, 0.5) 0%, rgba(0, 255, 0, 0) 70%);
            pointer-events: none;
            opacity: 0;
            z-index: 1;
        }

        .session-dashboard.show-framework::before {
            animation: fullscreenGreenBlast 1.5s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes fullscreenGreenBlast {
            0% { transform: translate(-50%, 50%) scale(1); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translate(-50%, 50%) scale(250); opacity: 0; }
        }

        .dashboard-content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 90%;
            max-width: 380px;
            z-index: 2;
        }

        .db-brand-block {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 16px;
            opacity: 0;
            filter: blur(10px);
            transform: translateY(-10px);
            transition: opacity 0.6s ease-out, filter 0.8s ease-out, transform 0.6s ease-out;
        }

        .session-dashboard.show-framework .db-brand-block {
            opacity: 1;
            filter: blur(0px);
            transform: translateY(0);
            transition-delay: 0.2s;
        }

        .db-logo-icon {
            width: 64px;  
            height: 64px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .db-text-right {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 6px;
        }

        .db-main-title, .success-message {
            font-family: 'Unbounded', sans-serif;
            margin: 0;
            text-transform: uppercase;
        }

        .db-main-title {
            color: #ffffff;
            font-size: 22px; 
            font-weight: 900;
            line-height: 1;
            letter-spacing: 1px;
            text-align: left;
        }

        .success-message {
            color: #00ff6e; 
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.8px;
            width: 100%;
            text-align: center;
        }

        .db-subtitle-badge {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 3px 8px;
            border-radius: 50px;
            display: inline-block;
        }

        .db-subtitle-badge span {
            font-family: 'Montserrat', sans-serif;
            font-size: 8px; 
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: #ffffff;
            display: block;
            line-height: 1;
        }

        .db-main-title span, .success-message span {
            display: inline-block;
            opacity: 0;
            filter: blur(8px);
            transform: scale(1.4) translateY(-10px);
            animation-duration: 0.5s;
            animation-timing-function: cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation-fill-mode: forwards;
        }

        .session-dashboard.show-framework .db-main-title span {
            animation-name: assembleLetterSimple;
        }

        .session-dashboard.show-framework .success-message span {
            animation-name: assembleLetterGreen;
        }

        @keyframes assembleLetterSimple {
            0% { opacity: 0; filter: blur(8px); transform: scale(1.4) translateY(-10px); }
            100% { opacity: 1; filter: blur(0px); transform: scale(1) translateY(0); }
        }

        @keyframes assembleLetterGreen {
            0% { opacity: 0; filter: blur(8px); transform: scale(1.4) translateY(-10px); text-shadow: 0 0 20px rgba(0, 255, 110, 1); }
            100% { opacity: 1; filter: blur(0px); transform: scale(1) translateY(0); text-shadow: 0 0 10px rgba(0, 255, 110, 0.3); }
        }

        .session-dashboard.fade-out-fast {
            opacity: 0;
            filter: blur(10px);
            transform: scale(0.95);
            transition: opacity 0.5s ease-in-out, filter 0.5s ease-in-out, transform 0.5s ease-in-out;
        }

        body.page-fade-out {
            opacity: 0;
            filter: blur(10px);
            transition: opacity 1.4s ease, filter 1.4s ease;
            pointer-events: none;
        }

        .fade-out-element {
            opacity: 0 !important;
            filter: blur(15px) !important;
            transform: translateY(-20px) !important;
            pointer-events: none !important;
            transition: opacity 0.8s ease, filter 0.8s ease, transform 0.8s ease !important;
        }

        .custom-input {
            font-size: 16px !important; 
        }
    </style>
</head>
<body>

    <div class="shadow-layer"></div>

    <img src="images/zaporozge_gerb.png" alt="Zaporozhye Big Gerb" class="bg-blur-gerb">

    <div id="bg-wave-container" style="display: none !important;"></div>

    <div id="click-prompt" class="prompt-text">Нажмите на экран</div>

    <div class="main-container">
        <div class="brand-block">
            <img src="images/geo_logo.png" alt="Geo Logo" class="logo-icon" id="main-logo">
            <div class="text-right">
                <h1 class="main-title">
                    <span>G</span><span>E</span><span>O</span><span>Г</span><span>Р</span><span>А</span><span>Ф</span><span>И</span><span>Я</span>
                </h1>
                <div class="subtitle-badge">
                    <span>наука • образование • естествознание</span>
                </div>
            </div>
        </div>

        <div class="input-container-box">
            <input 
                type="text" 
                class="custom-input" 
                placeholder="ввести..." 
                id="user-text-input" 
                autocomplete="off"
                autocorrect="off"
                autocapitalize="none"
                spellcheck="false"
            >
            <div class="input-underline"></div>
            <button class="input-submit-btn" id="submit-auth-btn">
                <svg class="icon-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
                <svg class="icon-loading" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="2" x2="12" y2="6"></line>
                    <line x1="12" y1="18" x2="12" y2="22"></line>
                    <line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line>
                    <line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line>
                    <line x1="2" y1="12" x2="6" y2="12"></line>
                    <line x1="18" y1="12" x2="22" y2="12"></line>
                    <line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line>
                    <line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line>
                </svg>
                <svg class="icon-error" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>

        <div class="bottom-credits-wrapper">
            <p class="bottom-credits" id="wave-text">проект Запорожской области</p>
        </div>
    </div>

    <div class="corner-icon-floating-wrapper">
        <img src="images/zaporoge_icon.png" alt="Zaporozhye Icon" class="corner-icon">
    </div>

    <div class="session-dashboard" id="session-dashboard">
        <div class="dashboard-content-wrapper">
            <div class="db-brand-block">
                <img src="images/geo_logo.png" alt="Geo Logo" class="db-logo-icon">
                <div class="db-text-right">
                    <h1 class="db-main-title" id="db-animate-title">GEОГРАФИЯ</h1>
                    <div class="db-subtitle-badge">
                        <span>наука • образование • естествознание</span>
                    </div>
                </div>
            </div>
            
            <div class="success-message-wrapper">
                <div class="success-message" id="db-animate-message">Вы успешно вошли в сессию</div>
                <svg class="success-checkmark" viewBox="0 0 52 52">
                    <circle class="checkmark-circle" cx="26" cy="26" r="23" fill="none"/>
                    <path class="checkmark-check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
                </svg>
            </div>
        </div>
    </div>

    <script>
    const textContainer = document.getElementById('wave-text');
    const logoElement = document.getElementById('main-logo');
    const promptElement = document.getElementById('click-prompt');
    const textInput = document.getElementById('user-text-input');
    const inputContainer = document.querySelector('.input-container-box');
    
    let initialText = "проект Запорожской области";
    let hasUserClicked = false; 
    let isClickAllowed = false;
    let isSecretTextActive = false; 
    let letters = [];

    setTimeout(() => { isClickAllowed = true; }, 3000);

    function buildWaveText(newText) {
        textContainer.innerHTML = '';
        letters = Array.from(newText).map((char) => {
            const span = document.createElement('span');
            span.style.display = 'inline-block';
            span.style.transition = 'color 0.3s ease, transform 0.3s ease, opacity 0.5s ease, filter 0.5s ease';
            if (isSecretTextActive) {
                span.style.opacity = '0';
                span.style.filter = 'blur(6px)';
                span.style.transform = 'translateY(10px)';
            }
            if (char === ' ') { span.innerHTML = '&nbsp;'; } else { span.innerText = char; }
            textContainer.appendChild(span);
            return span;
        });
    }

    buildWaveText(initialText);

    function showClickPrompt() {
        if (hasUserClicked) return; 
        promptElement.style.bottom = '120px';
        promptElement.style.left = '50%';
        promptElement.style.transform = 'translateX(-50%)';
        promptElement.classList.add('animate-prompt');
    }

    setTimeout(() => { if (!hasUserClicked) showClickPrompt(); }, 4500); 

    textInput.addEventListener('pointerdown', (e) => { e.stopPropagation(); });
    textInput.addEventListener('keydown', (e) => { e.stopPropagation(); });

    document.body.addEventListener('pointerdown', (e) => {
        if (!isClickAllowed) return;

        if (!hasUserClicked) {
            hasUserClicked = true;
            const computedStyle = window.getComputedStyle(promptElement);
            promptElement.style.opacity = computedStyle.opacity;
            promptElement.style.filter = computedStyle.filter;
            promptElement.style.transform = computedStyle.transform;
            promptElement.classList.remove('animate-prompt');
            void promptElement.offsetWidth;
            promptElement.style.transition = 'opacity 2.5s ease-in-out, filter 2.5s ease-in-out, transform 2.5s ease-in-out';
            promptElement.style.opacity = '0';
            promptElement.style.filter = 'blur(15px)';
            promptElement.style.transform = 'translateY(15px)';
            setTimeout(() => { promptElement.style.display = 'none'; }, 2500);
        }

        if (inputContainer && !inputContainer.classList.contains('active')) {
            if (!e.target.closest('.bottom-credits-wrapper')) {
                inputContainer.classList.add('active');
                isSecretTextActive = true; 
                textContainer.classList.add('secret-active');

                letters.forEach((span, i) => {
                    setTimeout(() => {
                        span.style.opacity = '0';
                        span.style.filter = 'blur(6px)';
                        span.style.transform = `translateY(${Math.random() > 0.5 ? -10 : 10}px)`;
                    }, i * 20); 
                });

                setTimeout(() => {
                    buildWaveText("введите код доступа к сессии");
                    letters.forEach((span, i) => {
                        setTimeout(() => {
                            span.style.opacity = '1';
                            span.style.filter = 'blur(0px)';
                            span.style.transform = 'translateY(0px)';
                        }, i * 20);
                    });
                }, 600);

                if (textInput) { setTimeout(() => textInput.focus(), 100); }
            }
        }
    });

    const submitBtn = document.getElementById('submit-auth-btn');
    const myInput = document.getElementById('user-text-input'); 
    let livesInErrorState = false;

    myInput.addEventListener('input', () => {
        const textLength = myInput.value.trim().length;
        if (textLength > 0) { submitBtn.classList.add('btn-active'); } 
        else { submitBtn.classList.remove('btn-active'); }

        if (livesInErrorState) {
            livesInErrorState = false;
            myInput.classList.remove('input-error-state'); 
            submitBtn.classList.remove('state-error');     
        }
    });

    myInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { submitBtn.click(); }
    });

    function prepareDashboardSpans(elementId, startDelay) {
        const el = document.getElementById(elementId);
        if (!el) return;
        const text = el.innerText;
        el.innerHTML = '';
        Array.from(text).forEach((char, index) => {
            const span = document.createElement('span');
            if (char === ' ') { span.innerHTML = '&nbsp;'; } else { span.innerText = char; }
            span.style.animationDelay = `${startDelay + (index * 0.04)}s`;
            el.appendChild(span);
        });
    }

    submitBtn.addEventListener('click', async () => {
        if (submitBtn.classList.contains('state-loading') || submitBtn.classList.contains('state-error')) return;

        const rawPassword = myInput.value.trim();
        if (!rawPassword) return;

        submitBtn.classList.add('state-loading');

        try {
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: rawPassword })
            });

            const data = await response.json();
            submitBtn.classList.remove('state-loading');

            if (response.ok && data.success) {
                const mainContainer = document.querySelector('.main-container');
                const cornerWrapper = document.querySelector('.corner-icon-floating-wrapper');
                const promptText = document.getElementById('click-prompt');
                const dashboardOverlay = document.getElementById('session-dashboard');

                if (mainContainer) mainContainer.classList.add('fade-out-element');
                if (cornerWrapper) cornerWrapper.classList.add('fade-out-element');
                if (promptText) promptText.classList.add('fade-out-element');
                
                if (dashboardOverlay) {
                    dashboardOverlay.style.display = 'flex';
                    prepareDashboardSpans('db-animate-title', 0.20);
                    prepareDashboardSpans('db-animate-message', 0.50);
                    
                    requestAnimationFrame(() => {
                        dashboardOverlay.classList.add('show-framework');
                    });
                }
                
                setTimeout(() => {
                    document.body.classList.add('page-fade-out');
                }, 4000); 

                setTimeout(() => {
                    window.location.href = '/beginning.html';
                }, 5400);

            } else {
                livesInErrorState = true;
                myInput.classList.add('input-error-state'); 
                submitBtn.classList.add('state-error');        
            }
        } catch (err) {
            console.error("Ошибка сети или сервера:", err);
            submitBtn.classList.remove('state-loading');
            livesInErrorState = true;
            myInput.classList.add('input-error-state'); 
            submitBtn.classList.add('state-error');
        }
    });
</script>
</body>
</html>
