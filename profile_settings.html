<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEOГРАФИЯ — Сессия</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js" defer></script>
    <script src="console.js" defer></script>

    <link rel="icon" type="image/png" href="images/favicon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Unbounded:wght@400;700;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="beginning.css">

    <style>
        /* Когда пользователь вошел — скрываем центральную кнопку */
        body.user-logged-in #open-auth-btn {
            display: none !important;
        }

        /* Плавное проявление страницы */
        body {
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        body.page-loaded {
            opacity: 1;
        }

        body.page-hidden {
            opacity: 0 !important;
        }

        /* Бренд-блок в верхнем левом углу */
        .top-left-brand {
            position: fixed;
            top: 40px;
            left: 40px;
            z-index: 10;
        }

        .top-left-brand .db-brand-block {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .top-left-brand .db-logo-icon {
            height: auto;
            max-width: 110px;
            width: 100%;
            display: block;
            will-change: transform;
            animation: floatingLogo 4s ease-in-out infinite alternate !important;
        }

        .top-left-brand .db-text-right {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* =========================================================
            ЛЕВИТИРУЮЩИЙ И СМЕНЯЮЩИЙСЯ ТЕКСТ БРЕНД-БЛОКА
            ========================================================= */
        .top-left-brand .db-main-title {
            position: relative;
            margin: 0;
            font-family: 'Unbounded', sans-serif;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: -0.5px;
            line-height: 1;
            color: #ffffff;
            white-space: nowrap;
            will-change: transform;
            
            animation: floatingText 4.5s ease-in-out infinite alternate !important;
        }

        .title-text-main,
        .title-text-alt {
            display: inline-block;
            transition: opacity 0.8s ease-in-out, filter 0.8s ease-in-out;
        }

        .title-text-alt {
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            filter: blur(8px);
        }

        .top-left-brand .db-main-title .title-text-main {
            animation: swapTextMain 7s ease-in-out infinite;
        }

        .top-left-brand .db-main-title .title-text-alt {
            animation: swapTextAlt 7s ease-in-out infinite;
        }

        @keyframes floatingLogo {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(-1.5deg); }
            100% { transform: translateY(5px) rotate(1.5deg); }
        }

        @keyframes floatingText {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
            100% { transform: translateY(4px); }
        }

        @keyframes swapTextMain {
            0%, 40%, 100% { opacity: 1; filter: blur(0px); }
            50%, 90% { opacity: 0; filter: blur(8px); }
        }

        @keyframes swapTextAlt {
            0%, 40%, 100% { opacity: 0; filter: blur(8px); }
            50%, 90% { opacity: 1; filter: blur(0px); }
        }

        /* =========================================================
            КНОПКА-СТРЕЛКА В ВЕРХНЕМ ПРАВОМ УГЛУ (С ВРАЩЕНИЕМ)
            ========================================================= */
        .back-nav-container {
            position: fixed;
            top: 40px;
            right: 40px;
            z-index: 100;
        }

        .back-arrow-btn {
            width: auto;
            height: auto;
            background: transparent;
            border: none;
            border-radius: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: none;
            color: #ffffff;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: none;

            opacity: 0;
            filter: blur(10px);
            transform: scale(0.5);
            animation: backArrowAppear 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.8s forwards;
            will-change: transform, opacity, filter;
        }

        .back-arrow-btn svg {
            width: 28px;
            height: 28px;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes backArrowAppear {
            0% { opacity: 0; filter: blur(10px); transform: scale(0.5); }
            100% { opacity: 1; filter: blur(0px); transform: scale(1); }
        }

        .back-arrow-btn:hover {
            transform: scale(1.12);
        }

        .back-arrow-btn:hover svg {
            transform: rotate(-360deg); /* Возвращает полный оборот при наведении */
        }

        .back-arrow-btn:active {
            transform: scale(0.9);
        }

        /* =========================================================
            БЛОК АККАУНТА (ЗАМЕДЛЕННЫЙ БЛИК)
            ========================================================= */
        #user-profile-widget,
        .top-center-account {
            position: absolute !important;
            top: 180px !important;
            left: 50% !important;
            transform: translateX(-50%) !important;
            right: auto !important;
            bottom: auto !important;
            z-index: 100 !important;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .account-title-large {
            position: relative;
            font-family: 'Montserrat', sans-serif;
            font-size: 28px;
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 3px;
            white-space: nowrap;
            display: inline-block;
            padding: 4px 12px;

            animation: accountBlurBounce 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards,
                       accountGlowPulse 1.6s ease-out forwards;
            will-change: transform, filter, opacity;
        }

        .account-title-large::after {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: -100vw;
            width: 35vw;
            background: linear-gradient(
                90deg, 
                transparent 0%, 
                rgba(255, 255, 255, 0.85) 50%, 
                transparent 100%
            );
            transform: skewX(-25deg);
            pointer-events: none;
            z-index: 2;
            animation: lightFlashFullWidth 1.1s cubic-bezier(0.25, 1, 0.5, 1) 0.6s 1 forwards;
        }

        @keyframes accountBlurBounce {
            0% { opacity: 0; filter: blur(20px); transform: scale(0.3); }
            60% { opacity: 1; filter: blur(2px); transform: scale(1.35); }
            80% { filter: blur(0px); transform: scale(0.92); }
            100% { opacity: 1; filter: blur(0px); transform: scale(1); }
        }

        @keyframes accountGlowPulse {
            0% { text-shadow: 0 0 0px rgba(255, 255, 255, 0); }
            50% { text-shadow: 0 0 45px rgba(255, 255, 255, 1), 0 0 20px rgba(52, 152, 219, 0.9); }
            100% { text-shadow: 0 0 20px rgba(255, 255, 255, 0.3); }
        }

        @keyframes lightFlashFullWidth {
            0% { left: -100vw; opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { left: 100vw; opacity: 0; }
        }

        /* =========================================================
            ЛИНИЯ-РАЗДЕЛИТЕЛЬ
            ========================================================= */
        .account-divider-line {
            position: absolute;
            top: 230px;
            left: 50%;
            transform: translateX(-50%) scaleX(0);
            width: 85vw;
            max-width: 900px;
            height: 1px;
            background: linear-gradient(
                90deg, 
                transparent 0%, 
                rgba(255, 255, 255, 0.4) 50%, 
                transparent 100%
            );
            z-index: 90;
            
            animation: lineExpandCenter 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.1s forwards;
            will-change: transform, opacity;
        }

        @keyframes lineExpandCenter {
            0% { opacity: 0; transform: translateX(-50%) scaleX(0); }
            100% { opacity: 1; transform: translateX(-50%) scaleX(1); }
        }

        /* =========================================================
            КНОПКИ СЛЕВА (УЛУЧШЕНА ПЛАВНОСТЬ И ОТКЛИК)
            ========================================================= */
        .account-actions-container {
            position: absolute;
            top: 255px;
            left: 40px;
            z-index: 98;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: flex-start;
        }

        .action-btn-styled {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 12px;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            
            /* Сверхплавный переход для всех состояний */
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            width: 100%;
            box-sizing: border-box;

            opacity: 0;
            filter: blur(10px);
            transform: translateY(15px);
            will-change: transform, opacity, filter, background, border-color, box-shadow;
            
            animation: actionsAppear 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .action-btn-styled:nth-child(1) { animation-delay: 1.2s; }
        .action-btn-styled:nth-child(2) { animation-delay: 1.35s; }
        .action-btn-styled:nth-child(3) { animation-delay: 1.5s; }

        .action-btn-styled:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.35);
            transform: translateX(6px) scale(1.02);
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.35);
        }

        /* Активная вкладка: мягкий сдвиг и подсветка */
        .action-btn-styled.active-tab {
            background: rgba(255, 255, 255, 0.18) !important;
            border-color: #ffffff !important;
            transform: translateX(10px) !important;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.45);
        }

        /* Эффект клика (нажатия) */
        .action-btn-styled:active {
            transform: translateX(6px) scale(0.97) !important;
            transition: transform 0.1s ease;
        }

        @keyframes actionsAppear {
            0% { opacity: 0; filter: blur(10px); transform: translateY(15px); }
            100% { opacity: 1; filter: blur(0px); transform: translateY(0); }
        }

        /* =========================================================
            КРУПНЫЙ ЦЕНТРАЛЬНЫЙ КОНТЕЙНЕР (ПЛАВНАЯ СМЕНА ВКЛАДОК)
            ========================================================= */
        .main-profile-container {
            position: absolute;
            top: 255px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            
            width: 84vw;
            max-width: 920px;
            
            min-height: 460px; 
            padding: 30px;
            box-sizing: border-box;

            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 22px;
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            z-index: 92;

            opacity: 0;
            filter: blur(12px);

            animation: containerAppear 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.0s forwards;
            transition: opacity 0.5s cubic-bezier(0.25, 1, 0.5, 1), 
                        filter 0.5s cubic-bezier(0.25, 1, 0.5, 1), 
                        transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        @keyframes containerAppear {
            0% {
                opacity: 0;
                filter: blur(12px);
                transform: translateX(-50%) translateY(20px) scale(0.97);
            }
            100% {
                opacity: 1;
                filter: blur(0px);
                transform: translateX(-50%) translateY(0) scale(1);
            }
        }

        /* Система вкладок с мягким бесшовным кроссфейдом */
        .tab-content {
            position: absolute;
            top: 30px;
            left: 30px;
            right: 30px;
            bottom: 30px;
            display: flex;
            flex-direction: column;
            
            opacity: 0;
            visibility: hidden;
            transform: translateY(8px);
            transition: opacity 0.4s cubic-bezier(0.25, 1, 0.5, 1), 
                        transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), 
                        visibility 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            pointer-events: none;
        }

        .tab-content.active-content {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            pointer-events: auto;
        }

        .empty-tab-placeholder {
            font-family: 'Montserrat', sans-serif;
            font-size: 15px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.5);
            text-align: left;
            padding: 20px 0;
        }

        /* =========================================================
            БЛОК ВЫХОДА ВНУТРИ КОНТЕЙНЕРА И КНОПКА
            ========================================================= */
        .session-logout-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .logout-label-text {
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            align-self: flex-start;
            text-align: left;
        }

        .red-primary-btn {
            align-self: flex-end;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 28px;
            background: linear-gradient(135deg, #d32f2f 0%, #b71c1c 100%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 0.5px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(183, 28, 28, 0.25);
            white-space: nowrap;
            
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .red-primary-btn:hover {
            background: linear-gradient(135deg, #e53935 0%, #c62828 100%);
            border-color: rgba(255, 255, 255, 0.45);
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 25px rgba(229, 57, 53, 0.4);
        }

        .red-primary-btn:active {
            transform: translateY(0) scale(0.97);
        }

        .red-primary-btn.is-loading {
            padding: 14px 34px;
            opacity: 0.85;
            pointer-events: none;
        }

        .btn-spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.35);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: btnSpinnerRotate 0.8s linear infinite;
            display: inline-block;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        @keyframes btnSpinnerRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .center-status-wrapper {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            pointer-events: none;
            text-align: center;
        }

        .auth-trigger-btn {
            pointer-events: auto;
        }

        .dev-side-panel {
            position: fixed;
            top: 50%;
            right: 0;
            transform: translate(100%, -50%);
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 15px;
            background: rgba(15, 15, 20, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-right: none;
            border-radius: 16px 0 0 16px;
            backdrop-filter: blur(15px);
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.5);
            z-index: 9999;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .dev-side-panel.visible {
            transform: translate(0, -50%);
        }

        .dev-panel-btn {
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border-radius: 10px;
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.25s ease;
        }

        .dev-panel-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateX(-3px);
        }

        .reset-open-link {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            font-family: 'Montserrat', sans-serif;
            cursor: pointer;
            text-decoration: underline;
            transition: color 0.2s ease;
        }

        .reset-open-link:hover {
            color: #ffffff;
        }
    </style>
</head>

    <script>
const waveContainer = document.getElementById('bg-wave-container');
let ambientTimeoutId = null;

function createBackgroundRipple(x, y, className, duration = 1500) {
    if (!waveContainer) return;
    const ripple = document.createElement('div');
    ripple.classList.add(className);
    ripple.style.left = `${x}px`;
    ripple.style.top = `${y}px`;
    waveContainer.appendChild(ripple);
    setTimeout(() => { ripple.remove(); }, duration);
}

function spawnAmbientWave() {
    clearTimeout(ambientTimeoutId);

    let spawnX = 0, spawnY = 0;
    const side = Math.floor(Math.random() * 4);
    switch(side) {
        case 0: spawnX = Math.random() * window.innerWidth; spawnY = -50; break;
        case 1: spawnX = window.innerWidth + 50; spawnY = Math.random() * window.innerHeight; break;
        case 2: spawnX = Math.random() * window.innerWidth; spawnY = window.innerHeight + 50; break;
        case 3: spawnX = -50; spawnY = Math.random() * window.innerHeight; break;
    }

    createBackgroundRipple(spawnX, spawnY, 'bg-ambient-ripple', 3000);
    ambientTimeoutId = setTimeout(spawnAmbientWave, 3000 + Math.random() * 4000);
}

document.body.addEventListener('mousedown', (e) => {
    createBackgroundRipple(e.clientX, e.clientY, 'bg-click-ripple');
});

history.pushState(null, null, location.href);
window.addEventListener('popstate', function () {
    navigateToPage('index.html');
});

function navigateToPage(targetPage) {
    const currentPage = window.location.pathname.split('/').pop() || 'beginning.html';
    if (currentPage === targetPage) return;

    document.body.classList.add('page-hidden');
    setTimeout(() => {
        window.location.href = targetPage;
    }, 500);
}

/* Сверхплавное переключение разделов с мягким кроссфейдом */
function switchTab(tabName) {
    const buttons = document.querySelectorAll('.action-btn-styled');
    const contents = document.querySelectorAll('.tab-content');

    buttons.forEach(btn => btn.classList.remove('active-tab'));
    contents.forEach(content => content.classList.remove('active-content'));

    const selectedBtn = document.querySelector(`.action-btn-styled[data-tab="${tabName}"]`);
    if (selectedBtn) {
        selectedBtn.classList.add('active-tab');
    }

    const selectedContent = document.getElementById(`tab-${tabName}`);
    if (selectedContent) {
        selectedContent.classList.add('active-content');
    }
}

async function handleLogout() {
    const btn = document.querySelector('.red-primary-btn');
    
    if (btn) {
        btn.classList.add('is-loading');
        btn.innerHTML = `Выход из аккаунта <span class="btn-spinner"></span>`;
    }

    try {
        const client = window.supabaseClient || window.supabase;
        if (client && client.auth) {
            await client.auth.signOut();
        }
    } catch (err) {
        console.error('Ошибка при выходе из аккаунта:', err);
    } finally {
        setTimeout(() => {
            navigateToPage('beginning.html');
        }, 600);
    }
}

document.addEventListener('DOMContentLoaded', () => {
    requestAnimationFrame(() => {
        document.body.classList.add('page-loaded');
    });

    setTimeout(() => { spawnAmbientWave(); }, 1000);

    // Плавное применение визуала первой кнопки сразу после её появления на экране
    setTimeout(() => {
        switchTab('settings');
    }, 1400);

    const DEV_EMAIL = 'dimay17ndex2009@yandex.ru';
    const sidePanel = document.getElementById('dev-side-panel');
    let hideTimeout = null;

    async function initDevPanel() {
        const client = window.supabaseClient || window.supabase;
        if (!client) return;

        try {
            const { data: { session } } = await client.auth.getSession();
            if (session?.user?.email === DEV_EMAIL) {
                setupHoverDetection();
            }
        } catch (err) {
            console.error('Ошибка проверки прав разработчика:', err);
        }
    }

    function setupHoverDetection() {
        if (!sidePanel) return;

        document.addEventListener('mousemove', (e) => {
            const distanceFromRight = window.innerWidth - e.clientX;
            if (distanceFromRight <= 60) {
                clearTimeout(hideTimeout);
                sidePanel.classList.add('visible');
            }
        });

        sidePanel.addEventListener('mouseenter', () => {
            clearTimeout(hideTimeout);
            sidePanel.classList.add('visible');
        });

        sidePanel.addEventListener('mouseleave', () => {
            hideTimeout = setTimeout(() => {
                sidePanel.classList.remove('visible');
            }, 2000);
        });
    }

    initDevPanel();
});
