<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEOГРАФИЯ — Сессия</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js" defer></script>
    <script src="console.js" defer></script>

    <link rel="icon" type="image/png" href="images/favicon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800;900&family=Unbounded:wght@400;700;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="beginning.css">

    <style>
        /* Когда пользователь вошел — скрываем центральную кнопку */
        body.user-logged-in #open-auth-btn {
            display: none !important;
        }

        /* Плавное проявление страницы */
        body {
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        body.page-loaded {
            opacity: 1;
        }

        body.page-hidden {
            opacity: 0 !important;
        }

        /* Бренд-блок в верхнем левом углу */
        .top-left-brand {
            position: fixed;
            top: 40px;
            left: 40px;
            z-index: 10;
        }

        .top-left-brand .db-brand-block {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .top-left-brand .db-logo-icon {
            height: auto;
            max-width: 110px;
            width: 100%;
            display: block;
            will-change: transform;
            animation: floatingLogo 4s ease-in-out infinite alternate !important;
        }

        .top-left-brand .db-text-right {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* =========================================================
           ЛЕВИТИРУЮЩИЙ И СМЕНЯЮЩИЙСЯ ТЕКСТ БРЕНД-БЛОКА
           ========================================================= */
        .top-left-brand .db-main-title {
            position: relative;
            margin: 0;
            font-family: 'Unbounded', sans-serif;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: -0.5px;
            line-height: 1;
            color: #ffffff;
            white-space: nowrap;
            will-change: transform;
            
            /* Сохраняем парение/левитацию */
            animation: floatingText 4.5s ease-in-out infinite alternate !important;
        }

        /* Текстовые слои для плавного переключения */
        .title-text-main,
        .title-text-alt {
            display: inline-block;
            transition: opacity 0.8s ease-in-out, filter 0.8s ease-in-out;
        }

        /* Вторая надпись накладывается поверх первой */
        .title-text-alt {
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            filter: blur(8px);
        }

        /* Циклическая смена названий каждые 6 секунд */
        .top-left-brand .db-main-title .title-text-main {
            animation: swapTextMain 7s ease-in-out infinite;
        }

        .top-left-brand .db-main-title .title-text-alt {
            animation: swapTextAlt 7s ease-in-out infinite;
        }

        /* Keyframes: Анимации парения (левитации) */
        @keyframes floatingLogo {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(-1.5deg); }
            100% { transform: translateY(5px) rotate(1.5deg); }
        }

        @keyframes floatingText {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
            100% { transform: translateY(4px); }
        }

        /* Keyframes: Смена первого текста «GEOГРАФИЯ» */
        @keyframes swapTextMain {
            0%, 40%, 100% {
                opacity: 1;
                filter: blur(0px);
            }
            50%, 90% {
                opacity: 0;
                filter: blur(8px);
            }
        }

        /* Keyframes: Смена второго текста «НАСТРОЙКИ ПРОФИЛЯ» */
        @keyframes swapTextAlt {
            0%, 40%, 100% {
                opacity: 0;
                filter: blur(8px);
            }
            50%, 90% {
                opacity: 1;
                filter: blur(0px);
            }
        }

        /* =========================================================
           БЛОК АККАУНТА (ПРЫЖОК, БЛЮР И ВСПЫШКА)
           ========================================================= */
        #user-profile-widget,
        .top-center-account {
            position: absolute !important;
            top: 180px !important;
            left: 50% !important;
            transform: translateX(-50%) !important;
            right: auto !important;
            bottom: auto !important;
            z-index: 100 !important;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .account-title-large {
            position: relative;
            font-family: 'Unbounded', sans-serif;
            font-size: 26px;
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 2px;
            white-space: nowrap;
            display: inline-block;

            animation: accountBlurBounce 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards,
                        accountGlowPulse 1.6s ease-out forwards;
            will-change: transform, filter, opacity;
        }

        .account-title-large::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -200vw;
            width: 100vw;
            height: 200%;
            background: linear-gradient(
                90deg, 
                transparent 0%, 
                rgba(255, 255, 255, 0.95) 50%, 
                transparent 100%
            );
            transform: skewX(-30deg);
            pointer-events: none;
            animation: lightFlash 1.2s ease-out 0.4s 1 forwards;
        }

        @keyframes accountBlurBounce {
            0% { opacity: 0; filter: blur(20px); transform: scale(0.3); }
            60% { opacity: 1; filter: blur(2px); transform: scale(1.35); }
            80% { filter: blur(0px); transform: scale(0.92); }
            100% { opacity: 1; filter: blur(0px); transform: scale(1); }
        }

        @keyframes accountGlowPulse {
            0% { text-shadow: 0 0 0px rgba(255, 255, 255, 0); }
            50% { text-shadow: 0 0 45px rgba(255, 255, 255, 1), 0 0 20px rgba(52, 152, 219, 0.9); }
            100% { text-shadow: 0 0 20px rgba(255, 255, 255, 0.3); }
        }

        @keyframes lightFlash {
            0% { left: -200vw; opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { left: 200vw; opacity: 0; }
        }

        /* =========================================================
           ЛИНИЯ-РАЗДЕЛИТЕЛЬ (ПО ЦЕНТРУ ПОД АККАУНТОМ)
           ========================================================= */
        .account-divider-line {
            position: absolute;
            top: 230px;
            left: 50%;
            transform: translateX(-50%) scaleX(0);
            width: 85vw;
            max-width: 900px;
            height: 1px;
            background: linear-gradient(
                90deg, 
                transparent 0%, 
                rgba(255, 255, 255, 0.4) 50%, 
                transparent 100%
            );
            z-index: 90;
            
            /* Появление линии из центра */
            animation: lineExpandCenter 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.1s forwards;
            will-change: transform, opacity;
        }

        @keyframes lineExpandCenter {
            0% {
                opacity: 0;
                transform: translateX(-50%) scaleX(0);
            }
            100% {
                opacity: 1;
                transform: translateX(-50%) scaleX(1);
            }
        }

        /* =========================================================
           КНОПКА СЛЕВА (НИЖЕ ЛИНИИ, ОТДЕЛЬНО ОТ КОНТЕЙНЕРА)
           ========================================================= */
        .account-actions-container {
            position: absolute;
            top: 255px;
            left: 40px;
            z-index: 98; /* Поверх контейнера */
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: flex-start;

            opacity: 0;
            filter: blur(10px);
            transform: translateY(15px);

            animation: actionsAppear 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.3s forwards;
        }

        .action-btn-styled {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 12px;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .action-btn-styled:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateX(4px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        @keyframes actionsAppear {
            0% { opacity: 0; filter: blur(10px); transform: translateY(15px); }
            100% { opacity: 1; filter: blur(0px); transform: translateY(0); }
        }

        /* =========================================================
           КРУПНЫЙ ЦЕНТРАЛЬНЫЙ КОНТЕЙНЕР
           ========================================================= */
        .main-profile-container {
            position: absolute;
            top: 255px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            
            width: 84vw;
            max-width: 920px;
            
            min-height: 460px; 
            padding: 30px;
            box-sizing: border-box;

            /* Стеклянный стиль */
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 22px;
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            z-index: 92;

            opacity: 0;
            filter: blur(12px);

            /* Появление контейнера */
            animation: containerAppear 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.5s forwards;
        }

        @keyframes containerAppear {
            0% {
                opacity: 0;
                filter: blur(12px);
                transform: translateX(-50%) translateY(20px) scale(0.97);
            }
            100% {
                opacity: 1;
                filter: blur(0px);
                transform: translateX(-50%) translateY(0) scale(1);
            }
        }

        /* =========================================================
           БЛОК ВЫХОДА ВНУТРИ КОНТЕЙНЕРА
           ========================================================= */
        .session-logout-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .logout-label-text {
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            align-self: flex-start; /* Выравнивание текста по левому краю */
            text-align: left;
        }

        /* Красная кнопка, аналогичная главной кнопке из beginning (акцентный градиент и свечение) */
        .red-primary-btn {
            align-self: flex-end; /* Выравнивание по правому краю */
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 28px;
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 14px;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 0.5px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 25px rgba(231, 76, 60, 0.4);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .red-primary-btn:hover {
            background: linear-gradient(135deg, #ff5252 0%, #d32f2f 100%);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 30px rgba(231, 76, 60, 0.6), 0 0 20px rgba(255, 82, 82, 0.4);
        }

        .red-primary-btn:active {
            transform: translateY(-1px) scale(0.99);
        }

        .center-status-wrapper {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            pointer-events: none;
            text-align: center;
        }

        .auth-trigger-btn {
            pointer-events: auto;
        }

        .dev-side-panel {
            position: fixed;
            top: 50%;
            right: 0;
            transform: translate(100%, -50%);
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 15px;
            background: rgba(15, 15, 20, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-right: none;
            border-radius: 16px 0 0 16px;
            backdrop-filter: blur(15px);
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.5);
            z-index: 9999;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .dev-side-panel.visible {
            transform: translate(0, -50%);
        }

        .dev-panel-btn {
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border-radius: 10px;
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.25s ease;
        }

        .dev-panel-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateX(-3px);
        }

        .reset-open-link {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            font-family: 'Montserrat', sans-serif;
            cursor: pointer;
            text-decoration: underline;
            transition: color 0.2s ease;
        }

        .reset-open-link:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="app-banners-container">
        <div class="app-banner banner-warning">
            <span class="banner-icon">🛠</span>
            <span>Ведется разработка сайта в раннем доступе</span>
        </div>
    </div>

    <div class="shadow-layer"></div>

    <div id="bg-wave-container"></div>

    <div class="top-left-brand">
        <div class="db-brand-block">
            <img src="images/geo_logo.png" alt="Geo Logo" class="db-logo-icon">
            <div class="db-text-right">
                <h1 class="db-main-title">
                    <span class="title-text-main">GEOГРАФИЯ</span>
                    <span class="title-text-alt">НАСТРОЙКИ ПРОФИЛЯ</span>
                </h1>
            </div>
        </div>
    </div>

    <div id="user-profile-widget" class="top-center-account" style="display: none;">
        <div class="account-title-large" id="profile-email-text">ПРОФИЛЬ</div>
    </div>

    <div class="account-divider-line"></div>

    <div class="account-actions-container" id="account-actions-block">
        <button type="button" class="action-btn-styled" onclick="console.log('Основные настройки')">
            Основные настройки
        </button>
    </div>

    <div class="main-profile-container" id="main-profile-block">
        <div class="session-logout-section">
            <span class="logout-label-text">Завершение сессии/выход из аккаунта</span>
            <button type="button" class="red-primary-btn" onclick="handleLogout()">
                Выход из аккаунта
            </button>
        </div>
    </div>

    <div class="center-status-wrapper">
        <button type="button" id="open-auth-btn" class="auth-trigger-btn" onclick="showAuthModal()">
            Войти / Зарегистрироваться
        </button>
    </div>

    <div id="dev-side-panel" class="dev-side-panel">
        <button type="button" class="dev-panel-btn" id="btn-main-profile" onclick="navigateToPage('beginning.html')">
            Основной профиль
        </button>
        <button type="button" class="dev-panel-btn" id="btn-admin-profile" onclick="navigateToPage('admin.html')">
            Профиль администратора
        </button>
    </div>

    <script src="auth-system.js?v=3"></script>

    <script>
const waveContainer = document.getElementById('bg-wave-container');
let ambientTimeoutId = null;

function createBackgroundRipple(x, y, className, duration = 1500) {
    if (!waveContainer) return;
    const ripple = document.createElement('div');
    ripple.classList.add(className);
    ripple.style.left = `${x}px`;
    ripple.style.top = `${y}px`;
    waveContainer.appendChild(ripple);
    setTimeout(() => { ripple.remove(); }, duration);
}

function spawnAmbientWave() {
    clearTimeout(ambientTimeoutId);

    let spawnX = 0, spawnY = 0;
    const side = Math.floor(Math.random() * 4);
    switch(side) {
        case 0: spawnX = Math.random() * window.innerWidth; spawnY = -50; break;
        case 1: spawnX = window.innerWidth + 50; spawnY = Math.random() * window.innerHeight; break;
        case 2: spawnX = Math.random() * window.innerWidth; spawnY = window.innerHeight + 50; break;
        case 3: spawnX = -50; spawnY = Math.random() * window.innerHeight; break;
    }

    createBackgroundRipple(spawnX, spawnY, 'bg-ambient-ripple', 3000);
    ambientTimeoutId = setTimeout(spawnAmbientWave, 3000 + Math.random() * 4000);
}

document.body.addEventListener('mousedown', (e) => {
    createBackgroundRipple(e.clientX, e.clientY, 'bg-click-ripple');
});

history.pushState(null, null, location.href);
window.addEventListener('popstate', function () {
    navigateToPage('index.html');
});

function navigateToPage(targetPage) {
    const currentPage = window.location.pathname.split('/').pop() || 'beginning.html';
    if (currentPage === targetPage) return;

    document.body.classList.add('page-hidden');
    setTimeout(() => {
        window.location.href = targetPage;
    }, 500);
}

async function handleLogout() {
    const client = window.supabaseClient || window.supabase;
    
    try {
        if (client && client.auth) {
            await client.auth.signOut();
        }
    } catch (err) {
        console.error('Ошибка при выходе из аккаунта:', err);
    } finally {
        navigateToPage('beginning.html');
    }
}

document.addEventListener('DOMContentLoaded', () => {
    requestAnimationFrame(() => {
        document.body.classList.add('page-loaded');
    });

    setTimeout(() => { spawnAmbientWave(); }, 1000);

    const DEV_EMAIL = 'dimay17ndex2009@yandex.ru';
    const sidePanel = document.getElementById('dev-side-panel');
    let hideTimeout = null;

    async function initDevPanel() {
        const client = window.supabaseClient || window.supabase;
        if (!client) return;

        try {
            const { data: { session } } = await client.auth.getSession();
            if (session?.user?.email === DEV_EMAIL) {
                setupHoverDetection();
            }
        } catch (err) {
            console.error('Ошибка проверки прав разработчика:', err);
        }
    }

    function setupHoverDetection() {
        if (!sidePanel) return;

        document.addEventListener('mousemove', (e) => {
            const distanceFromRight = window.innerWidth - e.clientX;
            if (distanceFromRight <= 60) {
                clearTimeout(hideTimeout);
                sidePanel.classList.add('visible');
            }
        });

        sidePanel.addEventListener('mouseenter', () => {
            clearTimeout(hideTimeout);
            sidePanel.classList.add('visible');
        });

        sidePanel.addEventListener('mouseleave', () => {
            hideTimeout = setTimeout(() => {
                sidePanel.classList.remove('visible');
            }, 2000);
        });
    }

    initDevPanel();
});
</script>

    <script src="app.js"></script>
    <script src="reset-password.js"></script>

    <button type="button" class="reset-open-link" onclick="showResetModal('request')">
        Забыли пароль?
    </button>
</body>
