<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEOГРАФИЯ — Сессия</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js" defer></script>
    <script src="console.js" defer></script>

    <link rel="icon" type="image/png" href="images/favicon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Unbounded:wght@400;700;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="beginning.css">

    <style>
        body.user-logged-in #open-auth-btn {
            display: none !important;
        }

        body {
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        body.page-loaded {
            opacity: 1;
        }

        body.page-hidden {
            opacity: 0 !important;
        }

        .top-left-brand {
            position: fixed;
            top: 40px;
            left: 40px;
            z-index: 10;
        }

        .top-left-brand .db-brand-block {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .top-left-brand .db-logo-icon {
            height: auto;
            max-width: 110px;
            width: 100%;
            display: block;
            will-change: transform;
            animation: floatingLogo 4s ease-in-out infinite alternate !important;
        }

        .top-left-brand .db-text-right {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .top-left-brand .db-main-title {
            position: relative;
            margin: 0;
            font-family: 'Unbounded', sans-serif;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: -0.5px;
            line-height: 1;
            color: #ffffff;
            white-space: nowrap;
            will-change: transform;
            animation: floatingText 4.5s ease-in-out infinite alternate !important;
        }

        .title-text-main, .title-text-alt {
            display: inline-block;
            transition: opacity 0.8s ease-in-out, filter 0.8s ease-in-out;
        }

        .title-text-alt {
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            filter: blur(8px);
        }

        .top-left-brand .db-main-title .title-text-main {
            animation: swapTextMain 7s ease-in-out infinite;
        }

        .top-left-brand .db-main-title .title-text-alt {
            animation: swapTextAlt 7s ease-in-out infinite;
        }

        @keyframes floatingLogo {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(-1.5deg); }
            100% { transform: translateY(5px) rotate(1.5deg); }
        }

        @keyframes floatingText {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
            100% { transform: translateY(4px); }
        }

        @keyframes swapTextMain {
            0%, 40%, 100% { opacity: 1; filter: blur(0px); }
            50%, 90% { opacity: 0; filter: blur(8px); }
        }

        @keyframes swapTextAlt {
            0%, 40%, 100% { opacity: 0; filter: blur(8px); }
            50%, 90% { opacity: 1; filter: blur(0px); }
        }

        /* =========================================================
           КНОПКА-СТРЕЛКА НАЗАД (ВМЕСТО ШЕСТЕРЕНКИ)
           ========================================================= */
        .back-nav-container {
            position: fixed;
            bottom: 40px; /* Позиция как у шестеренки в других файлах */
            left: 40px;
            z-index: 100;
        }

        .back-arrow-btn {
            width: 56px;
            height: 56px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(12px);
            color: white;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .back-arrow-btn svg {
            width: 24px;
            height: 24px;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Анимация: круговое движение вниз при наведении */
        .back-arrow-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        .back-arrow-btn:hover svg {
            /* Круговое движение через Rotate */
            transform: rotate(-360deg);
        }

        .back-arrow-btn:active {
            transform: scale(0.9);
        }

        /* =========================================================
           БЛОК АККАУНТА И КОНТЕЙНЕРЫ
           ========================================================= */
        #user-profile-widget, .top-center-account {
            position: absolute !important;
            top: 180px !important;
            left: 50% !important;
            transform: translateX(-50%) !important;
            z-index: 100 !important;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .account-title-large {
            position: relative;
            font-family: 'Montserrat', sans-serif;
            font-size: 28px;
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 3px;
            white-space: nowrap;
            padding: 4px 12px;
            animation: accountBlurBounce 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, accountGlowPulse 1.6s ease-out forwards;
        }

        .account-title-large::after {
            content: '';
            position: absolute;
            top: 0; left: -100vw;
            width: 35vw; height: 100%;
            background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.85) 50%, transparent 100%);
            transform: skewX(-25deg);
            animation: lightFlashFullWidth 1.1s cubic-bezier(0.25, 1, 0.5, 1) 0.6s 1 forwards;
        }

        @keyframes accountBlurBounce {
            0% { opacity: 0; filter: blur(20px); transform: scale(0.3); }
            60% { opacity: 1; filter: blur(2px); transform: scale(1.35); }
            80% { filter: blur(0px); transform: scale(0.92); }
            100% { opacity: 1; filter: blur(0px); transform: scale(1); }
        }

        @keyframes accountGlowPulse {
            0% { text-shadow: 0 0 0px rgba(255, 255, 255, 0); }
            50% { text-shadow: 0 0 45px rgba(255, 255, 255, 1), 0 0 20px rgba(52, 152, 219, 0.9); }
            100% { text-shadow: 0 0 20px rgba(255, 255, 255, 0.3); }
        }

        @keyframes lightFlashFullWidth {
            0% { left: -100vw; opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { left: 100vw; opacity: 0; }
        }

        .account-divider-line {
            position: absolute;
            top: 230px;
            left: 50%;
            transform: translateX(-50%) scaleX(0);
            width: 85vw;
            max-width: 900px;
            height: 1px;
            background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.4) 50%, transparent 100%);
            animation: lineExpandCenter 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.1s forwards;
        }

        @keyframes lineExpandCenter {
            0% { opacity: 0; transform: translateX(-50%) scaleX(0); }
            100% { opacity: 1; transform: translateX(-50%) scaleX(1); }
        }

        .account-actions-container {
            position: absolute;
            top: 255px;
            left: 40px;
            z-index: 98;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .action-btn-styled {
            display: inline-flex;
            align-items: center;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 12px;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            backdrop-filter: blur(10px);
            opacity: 0;
            transform: translateY(15px);
            animation: actionsAppear 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .action-btn-styled:nth-child(1) { animation-delay: 1.2s; }
        .action-btn-styled:nth-child(2) { animation-delay: 1.35s; }
        .action-btn-styled:nth-child(3) { animation-delay: 1.5s; }

        @keyframes actionsAppear {
            0% { opacity: 0; filter: blur(10px); transform: translateY(15px); }
            100% { opacity: 1; filter: blur(0px); transform: translateY(0); }
        }

        .main-profile-container {
            position: absolute;
            top: 255px;
            left: 50%;
            transform: translateX(-50%);
            width: 84vw;
            max-width: 920px;
            min-height: 460px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 22px;
            backdrop-filter: blur(15px);
            opacity: 0;
            animation: containerAppear 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.0s forwards;
        }

        @keyframes containerAppear {
            0% { opacity: 0; filter: blur(12px); transform: translateX(-50%) translateY(20px) scale(0.97); }
            100% { opacity: 1; filter: blur(0px); transform: translateX(-50%) translateY(0) scale(1); }
        }

        .red-primary-btn {
            align-self: flex-end;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 28px;
            background: linear-gradient(135deg, #d32f2f 0%, #b71c1c 100%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            color: white;
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .red-primary-btn.is-loading { padding: 14px 34px; opacity: 0.85; pointer-events: none; }

        .btn-spinner {
            width: 16px; height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.35);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: btnSpinnerRotate 0.8s linear infinite;
        }

        @keyframes btnSpinnerRotate { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .dev-side-panel {
            position: fixed;
            top: 50%; right: 0;
            transform: translate(100%, -50%);
            background: rgba(15, 15, 20, 0.85);
            padding: 15px;
            border-radius: 16px 0 0 16px;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .dev-side-panel.visible { transform: translate(0, -50%); }

        .reset-open-link {
            background: transparent; border: none;
            color: rgba(255, 255, 255, 0.6);
            font-family: 'Montserrat', sans-serif;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="top-left-brand">
        <div class="db-brand-block">
            <img src="images/geo_logo.png" alt="Geo Logo" class="db-logo-icon">
            <div class="db-text-right">
                <h1 class="db-main-title">
                    <span class="title-text-main">GEOГРАФИЯ</span>
                    <span class="title-text-alt">НАСТРОЙКИ ПРОФИЛЯ</span>
                </h1>
            </div>
        </div>
    </div>

    <div class="back-nav-container">
        <div class="back-arrow-btn" onclick="navigateToPage('beginning.html')" title="Вернуться назад">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
        </div>
    </div>

    <div id="user-profile-widget" class="top-center-account" style="display: none;">
        <div class="account-title-large" id="profile-email-text">ПРОФИЛЬ</div>
    </div>

    <div class="account-divider-line"></div>

    <div class="account-actions-container" id="account-actions-block">
        <button type="button" class="action-btn-styled" onclick="console.log('Основные настройки')">Основные настройки</button>
        <button type="button" class="action-btn-styled" onclick="console.log('Профиль')">Профиль</button>
        <button type="button" class="action-btn-styled" onclick="console.log('Техническая поддержка')">Техническая поддержка</button>
    </div>

    <div class="main-profile-container" id="main-profile-block">
        <div class="session-logout-section">
            <span class="logout-label-text">Завершение сессии/выход из аккаунта</span>
            <button type="button" class="red-primary-btn" onclick="handleLogout()">
                Выйти из аккаунта
            </button>
        </div>
    </div>

    <div id="dev-side-panel" class="dev-side-panel">
        <button type="button" class="action-btn-styled" onclick="navigateToPage('beginning.html')">Основной профиль</button>
    </div>

    <script>
        // Навигация с анимацией
        function navigateToPage(targetPage) {
            document.body.classList.add('page-hidden');
            setTimeout(() => {
                window.location.href = targetPage;
            }, 500);
        }

        // Выход из аккаунта
        async function handleLogout() {
            const btn = document.querySelector('.red-primary-btn');
            if (btn) {
                btn.classList.add('is-loading');
                btn.innerHTML = `Выход из аккаунта <span class="btn-spinner"></span>`;
            }

            try {
                const client = window.supabaseClient || window.supabase;
                if (client && client.auth) {
                    await client.auth.signOut();
                }
            } catch (err) {
                console.error('Ошибка при выходе:', err);
            } finally {
                setTimeout(() => {
                    navigateToPage('beginning.html');
                }, 600);
            }
        }

        // Появление страницы
        document.addEventListener('DOMContentLoaded', () => {
            requestAnimationFrame(() => {
                document.body.classList.add('page-loaded');
            });
        });
    </script>
</body>
</html>
