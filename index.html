<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEOГРАФИЯ</title>
    
    <link rel="icon" type="image/png" href="images/favicon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&family=Unbounded:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <style>
        .session-dashboard {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999; 
            pointer-events: none;
            overflow: hidden;
            display: none; 
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: transparent !important;
        }

        /* Зеленый взрыв/волна снизу экрана */
        .session-dashboard::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 10px;
            height: 10px;
            transform: translate(-50%, 50%) scale(1);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 255, 110, 0.5) 0%, rgba(0, 255, 0, 0) 70%);
            pointer-events: none;
            opacity: 0;
            z-index: 1;
        }

        .session-dashboard.show-framework::before {
            animation: fullscreenGreenBlast 1.5s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes fullscreenGreenBlast {
            0% { transform: translate(-50%, 50%) scale(1); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translate(-50%, 50%) scale(250); opacity: 0; }
        }

        .dashboard-content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 35px;
            width: 100%;
            max-width: 800px;
            z-index: 2;
        }

        .db-brand-block {
            display: flex;
            align-items: center;
            gap: 25px;
            opacity: 0;
            filter: blur(10px);
            transform: translateY(-10px);
            transition: opacity 0.6s ease-out, filter 0.8s ease-out, transform 0.6s ease-out;
        }

        .session-dashboard.show-framework .db-brand-block {
            opacity: 1;
            filter: blur(0px);
            transform: translateY(0);
            transition-delay: 0.2s;
        }

        .db-logo-icon {
            width: 90px;  
            height: 90px;
            object-fit: contain;
        }

        .db-text-right {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
        }

        .db-main-title, .success-message {
            font-family: 'Unbounded', sans-serif;
            margin: 0;
            text-transform: uppercase;
        }

        .db-main-title {
            color: #ffffff;
            font-size: 32px; 
            font-weight: 900;
            line-height: 1;
            letter-spacing: 1px;
            text-align: left;
        }

        .success-message {
            color: #00ff6e; 
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 2.5px;
            width: 100%;
            text-align: center;
        }

        .db-subtitle-badge {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.6);
            padding: 5px 14px;
            border-radius: 50px;
            display: inline-block;
        }

        .db-subtitle-badge span {
            font-family: 'Montserrat', sans-serif;
            font-size: 10px; 
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #ffffff;
            display: block;
            line-height: 1;
        }

        .db-main-title span, .success-message span {
            display: inline-block;
            opacity: 0;
            filter: blur(8px);
            transform: scale(1.4) translateY(-10px);
            animation-duration: 0.5s;
            animation-timing-function: cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation-fill-mode: forwards;
        }

        .session-dashboard.show-framework .db-main-title span {
            animation-name: assembleLetterSimple;
        }

        .session-dashboard.show-framework .success-message span {
            animation-name: assembleLetterGreen;
        }

        @keyframes assembleLetterSimple {
            0% { opacity: 0; filter: blur(8px); transform: scale(1.4) translateY(-10px); }
            100% { opacity: 1; filter: blur(0px); transform: scale(1) translateY(0); }
        }

        @keyframes assembleLetterGreen {
            0% { opacity: 0; filter: blur(8px); transform: scale(1.4) translateY(-10px); text-shadow: 0 0 20px rgba(0, 255, 110, 1); }
            100% { opacity: 1; filter: blur(0px); transform: scale(1) translateY(0); text-shadow: 0 0 10px rgba(0, 255, 110, 0.3); }
        }

        .session-dashboard.fade-out-fast {
            opacity: 0;
            filter: blur(10px);
            transform: scale(0.95);
            transition: opacity 0.5s ease-in-out, filter 0.5s ease-in-out, transform 0.5s ease-in-out;
        }
    </style>
</head>
<body>

                    <div class="intensity-label">интенсивность эмбиентных волн <span id="intensity-value">20%</span></div>
                </div>
                <div class="slider-wrapper">
                    <input type="range" id="wave-intensity-slider" min="0" max="100" value="20">
                </div>
            </div>
        </div>
    </div>

    <div id="click-prompt" class="prompt-text">Нажмите на экран</div>
