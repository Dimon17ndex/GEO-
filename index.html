<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEOГРАФИЯ</title>
    
    <link rel="icon" type="image/png" href="images/favicon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&family=Unbounded:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="shadow-layer"></div>

    <img src="images/zaporozge_gerb.png" alt="Zaporozhye Big Gerb" class="bg-blur-gerb">

    <div id="bg-wave-container"></div>

    <div class="main-container">
        
        <div class="brand-block">
            <img src="images/geo_logo.png" alt="Geo Logo" class="logo-icon" id="main-logo">
            
            <div class="text-right">
                <h1 class="main-title">
                    <span>G</span><span>E</span><span>O</span><span>Г</span><span>Р</span><span>А</span><span>Ф</span><span>И</span><span>Я</span>
                </h1>
                <div class="subtitle-badge">
                    <span>наука • образование • естествознание</span>
                </div>
            </div>
        </div>

        <div class="bottom-credits-wrapper">
            <p class="bottom-credits" id="wave-text">проект Запорожской области</p>
        </div>
        
    </div>

    <div class="corner-icon-floating-wrapper">
        <img src="images/zaporoge_icon.png" alt="Zaporozhye Icon" class="corner-icon">
    </div>

    <script>
        const textContainer = document.getElementById('wave-text');
        const waveContainer = document.getElementById('bg-wave-container');
        const logoElement = document.getElementById('main-logo');
        const text = textContainer.innerText;
        textContainer.innerHTML = '';

        let isWaveTriggered = false;
        let isTextHovered = false; 

        // Разделяем строку на буквы
        const letters = Array.from(text).map((char) => {
            const span = document.createElement('span');
            span.style.display = 'inline-block';
            span.style.transition = 'color 0.3s ease, transform 0.3s ease';
            if (char === ' ') {
                span.innerHTML = '&nbsp;';
            } else {
                span.innerText = char;
            }
            textContainer.appendChild(span);
            return span;
        });

        // Базовая функция генерации волн бэкграунда
        function createBackgroundRipple(x, y, className, duration = 1500) {
            const ripple = document.createElement('div');
            ripple.classList.add(className);
            ripple.style.left = `${x}px`;
            ripple.style.top = `${y}px`;
            waveContainer.appendChild(ripple);
            setTimeout(() => { ripple.remove(); }, duration);
        }

        // 1. БЕЛАЯ ВОЛНА НА ПОДХОДЕ ПЛАНЕТЫ
        setTimeout(() => {
            const rect = logoElement.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            createBackgroundRipple(centerX, centerY, 'bg-click-ripple');
        }, 1700);

        // АВТОМАТИЧЕСКИЕ ВОЛНЫ С ИЗМЕНЕНИЕМ ЦВЕТА И СПАВНОМ У КРАЕВ
        setTimeout(() => {
            function spawnAmbientWave() {
                let spawnX = 0;
                let spawnY = 0;
                
                const side = Math.floor(Math.random() * 4);
                switch(side) {
                    case 0: spawnX = Math.random() * window.innerWidth; spawnY = -50; break;
                    case 1: spawnX = window.innerWidth + 50; spawnY = Math.random() * window.innerHeight; break;
                    case 2: spawnX = Math.random() * window.innerWidth; spawnY = window.innerHeight + 50; break;
                    case 3: spawnX = -50; spawnY = Math.random() * window.innerHeight; break;
                }

                let currentClassName = 'bg-ambient-ripple'; // Белая по умолчанию
                
                if (isTextHovered) {
                    currentClassName = Math.random() > 0.5 ? 'bg-ambient-red' : 'bg-ambient-green';
                }

                createBackgroundRipple(spawnX, spawnY, currentClassName, 3000);

                const nextDelay = Math.random() * (5000 - 1000) + 1000;
                setTimeout(spawnAmbientWave, nextDelay);
            }
            spawnAmbientWave();
        }, 3500);

        // --- ЛОГИКА ФОНОВОЙ МУЗЫКИ С ИНТЕРВАЛОМ 5 СЕКУНД (ПЕРВЫЙ ВАРИАНТ С ПАПКОЙ audio) ---
        const audioPath = 'audio/melody_start.mp3'; 
        const bgMusic = new Audio(audioPath);
        bgMusic.volume = 0.4; // Громкость 40%
        let musicStarted = false;

        // Функция запуска музыки с проверкой окончания
        function playMusicWithInterval() {
            bgMusic.play().then(() => {
                musicStarted = true;
            }).catch(err => {
                console.log("Автозапуск заблокирован браузером. Музыка запустится после клика по экрану.");
            });
        }

        // Когда песня заканчивается, ждем 5 секунд и запускаем заново
        bgMusic.addEventListener('ended', () => {
            setTimeout(() => {
                bgMusic.play();
            }, 5000); // 5 секунд задержки
        });

        // Запуск музыки после появления всех элементов (примерно через 3.5 секунды)
        setTimeout(() => {
            playMusicWithInterval();
        }, 3500);

        // Резервный запуск музыки при первом клике (если autoplay заблокирован)
        document.body.addEventListener('click', () => {
            if (!musicStarted) {
                playMusicWithInterval();
            }
        }, { once: true }); // Сработает только один раз

        // 2. КРАСНАЯ ВОЛНА ПРИ НАВЕДЕНИИ НА ТЕКСТ
        letters.forEach((span, index) => {
            span.addEventListener('mouseenter', (e) => {
                isTextHovered = true; 

                letters.forEach((otherSpan, otherIndex) => {
                    const distance = Math.abs(index - otherIndex);
                    const delay = distance * 0.04;
                    
                    otherSpan.style.transitionDelay = `${delay}s`;
                    otherSpan.style.color = `rgba(255, 50, 50, ${Math.max(0.3, 1 - distance * 0.08)})`;
                    otherSpan.style.transform = `translateY(${Math.max(-4, -6 + distance * 0.5)}px)`;
                });

                if (!isWaveTriggered) {
                    isWaveTriggered = true;
                    createBackgroundRipple(e.clientX, e.clientY, 'bg-wave-ripple');
                }
            });
        });

        textContainer.addEventListener('mouseleave', () => {
            isWaveTriggered = false;
            isTextHovered = false; 

            letters.forEach((span) => {
                span.style.transitionDelay = '0s';
                span.style.color = '#ffffff';
                span.style.transform = 'translateY(0)';
            });
        });

        // 3. МЯГКАЯ БЕЛОВАТАЯ ВОЛНА ПРИ КЛИКЕ ПО ФОНУ
        document.body.addEventListener('mousedown', (e) => {
            createBackgroundRipple(e.clientX, e.clientY, 'bg-click-ripple');
        });
    </script>

</body>
</html>
