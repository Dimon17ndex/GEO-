<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEOГРАФИЯ</title>
    
    <link rel="icon" type="image/png" href="images/favicon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&family=Unbounded:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="shadow-layer"></div>

    <img src="images/zaporozge_gerb.png" alt="Zaporozhye Big Gerb" class="bg-blur-gerb">

    <div id="bg-wave-container"></div>

    <div class="settings-trigger-zone" id="settings-btn">
        <div class="settings-container-box">
            
            <div class="settings-icon-box">
                <svg class="gear-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.15a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.1a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>
            </div>
            
            <span class="settings-label">Настройки</span> 
            
            <div class="settings-horizontal-line"></div>
            
            <div class="settings-divider"></div>
            
            <div class="volume-btn" id="volume-toggle-btn">
                <svg class="volume-svg" id="volume-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <path class="volume-wave-1" d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                    <path class="volume-wave-2" d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                </svg>
                <div class="volume-label" id="volume-status-label">музыка <span class="status-on">on</span> / <span class="status-off">off</span></div>
            </div>

            <div class="intensity-control-box">
                <div class="intensity-btn">
                    <svg class="intensity-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
                        <circle cx="12" cy="12" r="4"/>
                    </svg>
                    <div class="intensity-label">интенсивность эмбиентных волн <span id="intensity-value">20%</span></div>
                </div>
                <div class="slider-wrapper">
                    <input type="range" id="wave-intensity-slider" min="0" max="100" value="20">
                </div>
            </div>

        </div>
    </div>

    <div id="click-prompt" class="prompt-text">Нажмите на экран</div>

    <div class="main-container">
        <div class="brand-block">
            <img src="images/geo_logo.png" alt="Geo Logo" class="logo-icon" id="main-logo">
            
            <div class="text-right">
                <h1 class="main-title">
                    <span>G</span><span>E</span><span>O</span><span>Г</span><span>Р</span><span>А</span><span>Ф</span><span>И</span><span>Я</span>
                </h1>
                <div class="subtitle-badge">
                    <span>наука • образование • естествознание</span>
                </div>
            </div>
        </div>

        <div class="bottom-credits-wrapper">
            <p class="bottom-credits" id="wave-text">проект Запорожской области</p>
        </div>
    </div>

    <div class="corner-icon-floating-wrapper">
        <img src="images/zaporoge_icon.png" alt="Zaporozhye Icon" class="corner-icon">
    </div>

    <script>
        const textContainer = document.getElementById('wave-text');
        const waveContainer = document.getElementById('bg-wave-container');
        const logoElement = document.getElementById('main-logo');
        const promptElement = document.getElementById('click-prompt');
        const volumeStatusLabel = document.getElementById('volume-status-label');
        const intensitySlider = document.getElementById('wave-intensity-slider');
        const intensityValueLabel = document.getElementById('intensity-value');
        
        const text = textContainer.innerText;
        textContainer.innerHTML = '';

        let isWaveTriggered = false;
        let isTextHovered = false; 
        let hasUserClicked = false; 
        let intensityPercent = 20;

        const letters = Array.from(text).map((char) => {
            const span = document.createElement('span');
            span.style.display = 'inline-block';
            span.style.transition = 'color 0.3s ease, transform 0.3s ease';
            if (char === ' ') {
                span.innerHTML = '&nbsp;';
            } else {
                span.innerText = char;
            }
            textContainer.appendChild(span);
            return span;
        });

        function createBackgroundRipple(x, y, className, duration = 1500) {
            const ripple = document.createElement('div');
            ripple.classList.add(className);
            ripple.style.left = `${x}px`;
            ripple.style.top = `${y}px`;
            waveContainer.appendChild(ripple);
            setTimeout(() => { ripple.remove(); }, duration);
        }

        setTimeout(() => {
            const rect = logoElement.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            createBackgroundRipple(centerX, centerY, 'bg-click-ripple');
        }, 1700);

        function spawnAmbientWave() {
            // Если выкручено на 0%, волны не генерируются
            if (intensityPercent === 0) {
                setTimeout(spawnAmbientWave, 1000);
                return;
            }

            let spawnX = 0;
            let spawnY = 0;
            
            const side = Math.floor(Math.random() * 4);
            switch(side) {
                case 0: spawnX = Math.random() * window.innerWidth; spawnY = -50; break;
                case 1: spawnX = window.innerWidth + 50; spawnY = Math.random() * window.innerHeight; break;
                case 2: spawnX = Math.random() * window.innerWidth; spawnY = window.innerHeight + 50; break;
                case 3: spawnX = -50; spawnY = Math.random() * window.innerHeight; break;
            }

            let currentClassName = 'bg-ambient-ripple';
            
            if (isTextHovered) {
                currentClassName = Math.random() > 0.5 ? 'bg-ambient-red' : 'bg-ambient-green';
            }

            createBackgroundRipple(spawnX, spawnY, currentClassName, 3000);

            // Тайминг зависит от интенсивности слайдера
            const baseDelay = 500; 
            const maxAdditionalDelay = 8000; 
            const factor = (100 - intensityPercent) / 100;
            const nextDelay = baseDelay + (Math.random() * maxAdditionalDelay * factor);
            
            setTimeout(spawnAmbientWave, nextDelay);
        }

        setTimeout(() => {
            spawnAmbientWave();
        }, 3500);

        const audioPath = 'audio/melody_start.mp3'; 
        const bgMusic = new Audio(audioPath);
        bgMusic.volume = 0.4; 
        let musicStarted = false;

        function playMusic() {
            if (musicStarted || bgMusic.muted) return;
            bgMusic.play().then(() => {
                musicStarted = true;
            }).catch(err => {
                console.log("Автозапуск ожидает взаимодействия с экраном.");
            });
        }

        bgMusic.addEventListener('ended', () => {
            setTimeout(() => {
                if (!bgMusic.muted) bgMusic.play();
            }, 5000); 
        });

        function showClickPrompt() {
            if (hasUserClicked) return; 

            const corners = [
                { top: '60px', left: '60px', bottom: 'auto', right: 'auto' },     
                { bottom: '120px', left: '60px', top: 'auto', right: 'auto' },    
                { bottom: '150px', right: '60px', top: 'auto', left: 'auto' }      
            ];

            const randomIndex = Math.floor(Math.random() * corners.length);
            const chosenCorner = corners[randomIndex];

            promptElement.style.top = chosenCorner.top;
            promptElement.style.bottom = chosenCorner.bottom;
            promptElement.style.left = chosenCorner.left;
            promptElement.style.right = chosenCorner.right;

            if (randomIndex === 2) {
                promptElement.classList.add('in-bottom-right');
            } else {
                promptElement.classList.remove('in-bottom-right');
            }

            promptElement.classList.add('animate-prompt');
        }

        setTimeout(() => {
            if (!hasUserClicked) {
                showClickPrompt();
            }
        }, 4500); 

        document.body.addEventListener('mousedown', (e) => {
            if (e.target.closest('#settings-btn') || e.target.closest('.settings-trigger-zone')) return;

            if (!hasUserClicked) {
                hasUserClicked = true;

                const computedStyle = window.getComputedStyle(promptElement);
                promptElement.style.opacity = computedStyle.opacity;
                promptElement.style.filter = computedStyle.filter;
                promptElement.style.transform = computedStyle.transform;

                promptElement.classList.remove('animate-prompt');
                void promptElement.offsetWidth;

                promptElement.style.transition = 'opacity 2.5s ease-in-out, filter 2.5s ease-in-out, transform 2.5s ease-in-out';
                promptElement.style.opacity = '0';
                promptElement.style.filter = 'blur(15px)';
                promptElement.style.transform = 'rotate(-4deg) translateY(15px)';

                setTimeout(() => {
                    promptElement.style.display = 'none';
                }, 2500);
            }

            playMusic();
            createBackgroundRipple(e.clientX, e.clientY, 'bg-click-ripple');
        });

        const volumeBtn = document.getElementById('volume-toggle-btn');
        const volumeIcon = document.getElementById('volume-icon');
        let isMuted = false;

        volumeBtn.addEventListener('click', (e) => {
            e.stopPropagation(); 
            isMuted = !isMuted;
            bgMusic.muted = isMuted;

            if (isMuted) {
                volumeStatusLabel.classList.add('muted-mode');
                volumeIcon.innerHTML = `
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <line x1="23" y1="9" x2="17" y2="15" stroke-width="1.5"></line>
                    <line x1="17" y1="9" x2="23" y2="15" stroke-width="1.5"></line>
                `;
            } else {
                volumeStatusLabel.classList.remove('muted-mode');
                volumeIcon.innerHTML = `
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <path class="volume-wave-1" d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                    <path class="volume-wave-2" d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                `;
                playMusic();
            }
        });

        // Слушатель для ползунка интенсивности волн
        intensitySlider.addEventListener('mousedown', (e) => {
            e.stopPropagation();
        });

        intensitySlider.addEventListener('input', (e) => {
            intensityPercent = parseInt(e.target.value);
            intensityValueLabel.innerText = `${intensityPercent}%`;
        });

        document.querySelector('.settings-icon-box').addEventListener('click', (e) => {
            e.stopPropagation();
        });

        letters.forEach((span, index) => {
            span.addEventListener('mouseenter', (e) => {
                isTextHovered = true; 

                letters.forEach((otherSpan, otherIndex) => {
                    const distance = Math.abs(index - otherIndex);
                    const delay = distance * 0.04;
                    
                    otherSpan.style.transitionDelay = `${delay}s`;
                    otherSpan.style.color = `rgba(255, 50, 50, ${Math.max(0.3, 1 - distance * 0.08)})`;
                    otherSpan.style.transform = `translateY(${Math.max(-4, -6 + distance * 0.5)}px)`;
                });

                if (!isWaveTriggered) {
                    isWaveTriggered = true;
                    createBackgroundRipple(e.clientX, e.clientY, 'bg-wave-ripple');
                }
            });
        });

        textContainer.addEventListener('mouseleave', () => {
            isWaveTriggered = false;
            isTextHovered = false; 

            letters.forEach((span) => {
                span.style.transitionDelay = '0s';
                span.style.color = '#ffffff';
                span.style.transform = 'translateY(0)';
            });
        });
    </script>
</body>
</html>
