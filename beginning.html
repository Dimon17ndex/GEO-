<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEOГРАФИЯ — Сессия</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js" defer></script>
    <script src="console.js" defer></script>

    <link rel="icon" type="image/png" href="images/favicon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&family=Unbounded:wght@400;700;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="beginning.css">

    <style>
        /* Когда пользователь вошел — гарантированно скрываем центральную кнопку */
        body.user-logged-in #open-auth-btn {
            display: none !important;
        }

        /* Плавное проявление и затухание страницы */
        body {
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        body.page-loaded {
            opacity: 1;
        }

        /* Класс для плавного угасания перед переходом */
        body.page-hidden {
            opacity: 0 !important;
        }

        /* Позиционирование бренд-блока в верхнем левом углу */
        .top-left-brand {
            position: fixed;
            top: 40px;
            left: 40px;
            z-index: 10;
        }

        .top-left-brand .db-brand-block {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .top-left-brand .db-logo-icon {
            height: auto;
            max-width: 110px;
            width: 100%;
            display: block;
            will-change: transform;
            animation: floatingLogo 4s ease-in-out infinite alternate !important;
        }

        .top-left-brand .db-text-right {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .top-left-brand .db-main-title {
            margin: 0;
            font-family: 'Unbounded', sans-serif;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: -0.5px;
            line-height: 1;
            color: #ffffff;
            will-change: transform;
            animation: floatingText 4.5s ease-in-out infinite alternate !important;
        }

        /* Анимация левитации */
        @keyframes floatingLogo {
            0% {
                transform: translateY(0px) rotate(0deg);
            }
            50% {
                transform: translateY(-8px) rotate(-1.5deg);
            }
            100% {
                transform: translateY(5px) rotate(1.5deg);
            }
        }

        @keyframes floatingText {
            0% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-6px);
            }
            100% {
                transform: translateY(4px);
            }
        }

        /* =========================================================
           ВИДЖЕТ ПРОФИЛЯ В ВЕРХНЕМ ПРАВОМ УГЛУ (выпадает Выйти)
           ========================================================= */
        .top-right-profile {
            position: fixed;
            top: 40px;          /* На одном уровне с логотипом */
            right: 140px;       /* Безопасное расстояние от шестерёнки */
            z-index: 10;
        }

        .profile-card {
            position: relative;
            display: inline-block;
            padding: 10px 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .profile-card:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .profile-username {
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Маленькая стрелочка возле профиля */
        .profile-username::after {
            content: '▾';
            font-size: 10px;
            opacity: 0.6;
            transition: transform 0.2s ease;
        }

        .profile-card:hover .profile-username::after {
            transform: rotate(180deg);
        }

        /* Выпадающая кнопка "Выйти" */
        .logout-dropdown-btn {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            width: 100%;
            padding: 10px 0;
            background: #e74c3c;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            
            /* Скрыта по умолчанию */
            opacity: 0;
            visibility: hidden;
            transform: translateY(-5px);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4);
        }

        /* Появление кнопки при наведении на карточку профиля */
        .profile-card:hover .logout-dropdown-btn {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .logout-dropdown-btn:hover {
            background: #c0392b;
        }

        /* Контейнер для размещения статуса строго по центру экрана */
        .center-status-wrapper {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            pointer-events: none;
            text-align: center;
        }

        /* Разрешаем клики по кнопке внутри pointer-events: none контейнера */
        .auth-trigger-btn {
            pointer-events: auto;
        }

        /* Серый статус "ЗДЕСЬ ПОКА ПУСТО" */
        .empty-status-message {
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.4);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.05);
        }

        /* =========================================================
           ВЫДВИЖНАЯ СЕКРЕТНАЯ ПАНЕЛЬ АДМИНИСТРАТОРА
           ========================================================= */
        .dev-side-panel {
            position: fixed;
            top: 50%;
            right: 0;
            transform: translate(100%, -50%); /* Спрятано за правым краем */
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 15px;
            background: rgba(15, 15, 20, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-right: none;
            border-radius: 16px 0 0 16px;
            backdrop-filter: blur(15px);
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.5);
            z-index: 9999;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .dev-side-panel.visible {
            transform: translate(0, -50%); /* Показывается */
        }

        .dev-panel-btn {
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border-radius: 10px;
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.25s ease;
        }

        .dev-panel-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateX(-3px);
        }

        .dev-panel-btn.active-page {
            border-color: #3498db;
            background: rgba(52, 152, 219, 0.2);
        }

        .reset-open-link {
    background: transparent;
    border: none;
    color: rgba(255, 255, 255, 0.6);
    font-size: 13px;
    font-family: 'Montserrat', sans-serif;
    cursor: pointer;
    text-decoration: underline;
    transition: color 0.2s ease;
}

.reset-open-link:hover {
    color: #ffffff;
}
    </style>
</head>
<body>

    <div class="app-banners-container">
        <div class="app-banner banner-warning">
            <span class="banner-icon">🛠</span>
            <span>Ведется разработка сайта в раннем доступе</span>
        </div>
    </div>

    <div class="shadow-layer"></div>

    <div id="bg-wave-container"></div>

    <div class="top-left-brand">
        <div class="db-brand-block">
            <img src="images/geo_logo.png" alt="Geo Logo" class="db-logo-icon">
            <div class="db-text-right">
                <h1 class="db-main-title">GEOГРАФИЯ</h1>
            </div>
        </div>
    </div>

    <div class="center-status-wrapper">
        <button type="button" id="open-auth-btn" class="auth-trigger-btn" onclick="showAuthModal()">
            Войти / Зарегистрироваться
        </button>

        <div class="empty-status-message">ЗДЕСЬ ПОКА ПУСТО</div>
    </div>

    <div class="settings-trigger-zone" id="settings-btn" style="opacity: 1; pointer-events: auto;">
        <div class="settings-container-box">
            <div class="settings-icon-box">
                <svg class="gear-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.15a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.1a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>
            </div>
            <span class="settings-label">Настройки</span> 
            <div class="settings-horizontal-line"></div>
            <div class="settings-divider"></div>
            <div class="volume-btn" id="volume-toggle-btn">
                <svg class="volume-svg" id="volume-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <path class="volume-wave-1" d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                    <path class="volume-wave-2" d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                </svg>
                <div class="volume-label" id="volume-status-label">музыка <span class="status-on">on</span> / <span class="status-off">off</span></div>
            </div>
            <div class="intensity-control-box">
                <div class="intensity-btn">
                    <svg class="intensity-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
                        <circle cx="12" cy="12" r="4"/>
                    </svg>
                    <div class="intensity-label">интенсивность эмбиентных волн <span id="intensity-value">20%</span></div>
                </div>
                <div class="slider-wrapper">
                    <input type="range" id="wave-intensity-slider" min="0" max="100" value="20">
                </div>
            </div>
        </div>
    </div>

    <div id="user-profile-widget" class="top-right-profile" style="display: none;">
        <div class="profile-card">
            <span class="profile-username" id="profile-email-text">Профиль</span>
            <button type="button" class="logout-dropdown-btn" onclick="logoutUser()">Выйти</button>
        </div>
    </div>

    <div id="dev-side-panel" class="dev-side-panel">
        <button type="button" class="dev-panel-btn" id="btn-main-profile" onclick="navigateToPage('beginning.html')">
            Основной профиль
        </button>
        <button type="button" class="dev-panel-btn" id="btn-admin-profile" onclick="navigateToPage('admin.html')">
            Профиль администратора
        </button>
    </div>

    <script src="auth-system.js?v=3"></script>

    <script>
// Переменные состояния
const waveContainer = document.getElementById('bg-wave-container');
const volumeStatusLabel = document.getElementById('volume-status-label');
const intensitySlider = document.getElementById('wave-intensity-slider');
const intensityValueLabel = document.getElementById('intensity-value');

let intensityPercent = 20;
let ambientTimeoutId = null; // Фикс параллельных циклов волн

// Генерация визуальных волн
function createBackgroundRipple(x, y, className, duration = 1500) {
    if (!waveContainer) return;
    const ripple = document.createElement('div');
    ripple.classList.add(className);
    ripple.style.left = `${x}px`;
    ripple.style.top = `${y}px`;
    waveContainer.appendChild(ripple);
    setTimeout(() => { ripple.remove(); }, duration);
}

// Фоновые амбиентные волны с защитой от дублирования таймеров
function spawnAmbientWave() {
    clearTimeout(ambientTimeoutId);

    if (intensityPercent === 0) { 
        ambientTimeoutId = setTimeout(spawnAmbientWave, 1000); 
        return; 
    }

    let spawnX = 0, spawnY = 0;
    const side = Math.floor(Math.random() * 4);
    switch(side) {
        case 0: spawnX = Math.random() * window.innerWidth; spawnY = -50; break;
        case 1: spawnX = window.innerWidth + 50; spawnY = Math.random() * window.innerHeight; break;
        case 2: spawnX = Math.random() * window.innerWidth; spawnY = window.innerHeight + 50; break;
        case 3: spawnX = -50; spawnY = Math.random() * window.innerHeight; break;
    }

    createBackgroundRipple(spawnX, spawnY, 'bg-ambient-ripple', 3000);

    const baseDelay = 500, maxAdditionalDelay = 8000; 
    const factor = (100 - intensityPercent) / 100;
    const nextDelay = baseDelay + (Math.random() * maxAdditionalDelay * factor);

    ambientTimeoutId = setTimeout(spawnAmbientWave, nextDelay);
}

// Аудио сопровождение
const bgMusic = new Audio('audio/melody_start.mp3');
bgMusic.volume = 0.4; 
let musicStarted = false;

function playMusic() {
    if (musicStarted || bgMusic.muted) return;
    bgMusic.play().then(() => { musicStarted = true; }).catch(() => {});
}

bgMusic.addEventListener('ended', () => {
    setTimeout(() => { if (!bgMusic.muted) bgMusic.play(); }, 5000); 
});

document.body.addEventListener('mousedown', (e) => {
    if (e.target.closest('#settings-btn') || e.target.closest('.settings-trigger-zone')) return;
    playMusic();
    createBackgroundRipple(e.clientX, e.clientY, 'bg-click-ripple');
});

// Управление звуком
const volumeBtn = document.getElementById('volume-toggle-btn');
const volumeIcon = document.getElementById('volume-icon');
let isMuted = false;

volumeBtn?.addEventListener('click', (e) => {
    e.stopPropagation(); 
    isMuted = !isMuted;
    bgMusic.muted = isMuted;
    
    if (isMuted) {
        volumeStatusLabel?.classList.add('muted-mode');
        volumeIcon.innerHTML = `<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15" stroke="currentColor" stroke-width="1.5"></line><line x1="17" y1="9" x2="23" y2="15" stroke="currentColor" stroke-width="1.5"></line>`;
    } else {
        volumeStatusLabel?.classList.remove('muted-mode');
        volumeIcon.innerHTML = `<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path class="volume-wave-1" d="M19.07 4.93a10 10 0 0 1 0 14.14"></path><path class="volume-wave-2" d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>`;
        playMusic();
    }
});

// Управление интенсивностью
intensitySlider?.addEventListener('mousedown', (e) => { e.stopPropagation(); });
intensitySlider?.addEventListener('input', (e) => {
    intensityPercent = parseInt(e.target.value);
    if (intensityValueLabel) intensityValueLabel.innerText = `${intensityPercent}%`;
});

// Перехватываем кнопку "Назад"
history.pushState(null, null, location.href);
window.addEventListener('popstate', function () {
    navigateToPage('index.html');
});

// Функция навигации с анимацией затухания
function navigateToPage(targetPage) {
    const currentPage = window.location.pathname.split('/').pop() || 'beginning.html';
    
    // Если пытаемся перейти на ту же страницу — ничего не делаем и не гасим экран
    if (currentPage === targetPage) return;

    // Плавно гасим страницу
    document.body.classList.add('page-hidden');

    // Переходим на другую страницу после завершения CSS-транзишна (500мс)
    setTimeout(() => {
        window.location.href = targetPage;
    }, 500);
}

// ЕДИНЫЙ ОБРАБОТЧИК ЗАГРУЗКИ СТРАНИЦЫ
document.addEventListener('DOMContentLoaded', () => {
    // 1. Анимация появления
    requestAnimationFrame(() => {
        document.body.classList.add('page-loaded');
    });

    // 2. Запуск волн
    setTimeout(() => { spawnAmbientWave(); }, 1000);

    // 3. Инициализация панели администратора
    const DEV_EMAIL = 'dimay17ndex2009@yandex.ru';
    const sidePanel = document.getElementById('dev-side-panel');
    let hideTimeout = null;

    // Подсветка активной страницы
    const currentPage = window.location.pathname.split('/').pop() || 'beginning.html';
    if (currentPage === 'beginning.html') {
        document.getElementById('btn-main-profile')?.classList.add('active-page');
    } else if (currentPage === 'admin.html') {
        document.getElementById('btn-admin-profile')?.classList.add('active-page');
    }

    async function initDevPanel() {
        const client = window.supabaseClient || window.supabase;
        if (!client) return;

        try {
            const { data: { session } } = await client.auth.getSession();
            if (session?.user?.email === DEV_EMAIL) {
                setupHoverDetection();
            }
        } catch (err) {
            console.error('Ошибка проверки прав разработчика:', err);
        }
    }

    function setupHoverDetection() {
        if (!sidePanel) return;

        document.addEventListener('mousemove', (e) => {
            const distanceFromRight = window.innerWidth - e.clientX;
            if (distanceFromRight <= 60) {
                clearTimeout(hideTimeout);
                sidePanel.classList.add('visible');
            }
        });

        sidePanel.addEventListener('mouseenter', () => {
            clearTimeout(hideTimeout);
            sidePanel.classList.add('visible');
        });

        sidePanel.addEventListener('mouseleave', () => {
            hideTimeout = setTimeout(() => {
                sidePanel.classList.remove('visible');
            }, 2000);
        });
    }

    initDevPanel();
});
</script>

    <script src="app.js"></script>
    <script src="reset-password.js"></script>

    <button type="button" class="reset-open-link" onclick="showResetModal('request')">
    Забыли пароль?
</button>
</body>
</html>
